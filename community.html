<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiches & Critiques - Forum Actu Manga</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .badge {
            background: #f39c12; color: white; padding: 2px 6px; font-size: 10px;
            border-radius: 3px; font-weight: bold; text-transform: uppercase;
        }
        .badge.manga { background: #e84393; }
        .badge.anime { background: #0984e3; }
        .badge.game { background: #00b894; }
        
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        .form-group {
            flex: 1;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 3px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="wrapper">
        <div class="breadcrumb">
            <a href="index.html">Index du Forum</a> &raquo; <span>Fiches & Critiques</span>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <button id="btn-toggle-form" style="background: #e84393; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer;">+ Créer une Fiche / Sujet</button>
            <div>
                <button onclick="filterSheets('all')" style="padding: 5px 10px; cursor: pointer;">Tous</button>
                <button onclick="filterSheets('manga')" style="padding: 5px 10px; cursor: pointer;">Mangas</button>
                <button onclick="filterSheets('anime')" style="padding: 5px 10px; cursor: pointer;">Animes</button>
                <button onclick="filterSheets('game')" style="padding: 5px 10px; cursor: pointer;">Jeux Vidéo</button>
            </div>
        </div>

        <!-- FORMULAIRE DE CRÉATION DE FICHE COMPLET -->
        <div id="form-container" style="display: none; background: #fff; border: 1px solid #e84393; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
            <div style="background: #e84393; color: white; padding: 8px; font-weight: bold; margin-bottom: 15px; border-radius: 3px;">Créer une nouvelle Fiche ou Critique</div>
            
            <form id="form-create-sheet">
                <div class="form-row">
                    <div class="form-group">
                        <label>Type de contenu :</label>
                        <select id="sheet-type" required>
                            <option value="manga">Manga</option>
                            <option value="anime">Anime</option>
                            <option value="game">Jeu Vidéo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Titre de l'œuvre :</label>
                        <input type="text" id="sheet-title" placeholder="Ex: Chainsaw Man - Tome 1" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>URL de l'affiche / image :</label>
                        <input type="url" id="sheet-cover" placeholder="https://exemple.com/image.jpg" required>
                    </div>
                    <div class="form-group">
                        <label>Auteur / Studio :</label>
                        <input type="text" id="sheet-author-detail" placeholder="Ex: Tatsuki Fujimoto" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Genre :</label>
                        <input type="text" id="sheet-genre" placeholder="Ex: Shonen, Action, Gore" required>
                    </div>
                    <div class="form-group">
                        <label>Tranche d'âge :</label>
                        <select id="sheet-age">
                            <option value="Tous publics">Tous publics</option>
                            <option value="10 ans et +">10 ans et +</option>
                            <option value="12 ans et +">12 ans et +</option>
                            <option value="16 ans et +">16 ans et +</option>
                            <option value="18 ans et +">18 ans et +</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Note globale :</label>
                        <select id="sheet-rating">
                            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                            <option value="4">⭐⭐⭐⭐ (4/5)</option>
                            <option value="3">⭐⭐⭐ (3/5)</option>
                            <option value="2">⭐⭐ (2/5)</option>
                            <option value="1">⭐ (1/5)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 10px;">
                    <label>Synopsis / Résumé :</label>
                    <textarea id="sheet-synopsis" rows="3" placeholder="Résumé de l'œuvre..." required></textarea>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label>Avis personnel :</label>
                    <textarea id="sheet-review" rows="2" placeholder="Ton avis personnel sur l'œuvre..." required></textarea>
                </div>

                <button type="submit" style="background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer;">Publier la fiche</button>
            </form>
        </div>

        <!-- TABLEAU DES FICHES -->
        <table class="forum-table">
            <thead>
                <tr>
                    <th>Fiches de la communauté</th>
                    <th style="width: 120px; text-align: center;">Note / Type</th>
                    <th style="width: 80px; text-align: center;">Avis</th>
                    <th style="width: 130px; text-align: right;">Auteur</th>
                </tr>
            </thead>
            <tbody id="sheets-table-body">
                <tr>
                    <td colspan="4" style="text-align: center; color: #7f8c8d;">Chargement des fiches...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- SCRIPT SUPABASE -->
    <script type="module">
        import { supabase } from './supabase.js';

        const currentUsername = localStorage.getItem('forumUsername');
        let allSheets = [];

        // Gestion de l'affichage du formulaire
        const toggleBtn = document.getElementById('btn-toggle-form');
        const formContainer = document.getElementById('form-container');
        
        toggleBtn.addEventListener('click', () => {
            if (!currentUsername) {
                alert("Vous devez être connecté pour créer une fiche !");
                window.location.href = "register.html";
                return;
            }
            formContainer.style.display = formContainer.style.display === 'none' ? 'block' : 'none';
        });

        async function loadSheets() {
            const { data, error } = await supabase
                .from('topics')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Erreur chargement fiches:", error);
                return;
            }

            allSheets = data || [];
            renderSheets(allSheets);
        }

        function renderSheets(sheets) {
            const tbody = document.getElementById('sheets-table-body');

            if (sheets.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #7f8c8d;">Aucune fiche pour le moment. Soyez le premier à en créer une !</td></tr>`;
                return;
            }

            tbody.innerHTML = sheets.map(sheet => {
                let type = sheet.sheet_type || 'manga';
                let typeLabels = { manga: "📖 MANGA", anime: "📺 ANIME", game: "🎮 JEU" };
                let ratingNum = sheet.rating || 5;
                let stars = "⭐".repeat(ratingNum);
                let author = sheet.author || 'Anonyme';
                let isAdm = (author === 'Admin_Otaku' || author === 'Otaku_33');
                let aClass = isAdm ? 'group-admin' : 'group-member';

                return `
                    <tr>
                        <td>
                            <a href="sheet-view.html?id=${sheet.id}" style="font-weight: bold; color: #c2185b; font-size: 14px; text-decoration: none;">${sheet.title}</a>
                            <div style="font-size: 11px; color: #7f8c8d; margin-top: 2px;">${sheet.genre || ''} • ${sheet.details || ''}</div>
                        </td>
                        <td style="text-align: center;">
                            <span class="badge ${type}">${typeLabels[type] || 'MANGA'}</span>
                            <div style="font-size: 10px; margin-top: 3px; color: #f1c40f;">${stars}</div>
                        </td>
                        <td style="text-align: center; font-size: 12px; color: #555;">${sheet.replies_count || 0}</td>
                        <td style="text-align: right;">
                            <a href="profile.html?user=${encodeURIComponent(author)}" class="${aClass}" style="font-size: 12px;">${author}</a>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        window.filterSheets = function(type) {
            if (type === 'all') {
                renderSheets(allSheets);
            } else {
                const filtered = allSheets.filter(s => (s.sheet_type || 'manga') === type);
                renderSheets(filtered);
            }
        }

        // Soumission du formulaire de création
        document.getElementById('form-create-sheet').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!currentUsername) {
                alert("Session expirée, veuillez vous reconnecter.");
                window.location.href = "register.html";
                return;
            }

            const newSheet = {
                title: document.getElementById('sheet-title').value,
                sheet_type: document.getElementById('sheet-type').value,
                cover_url: document.getElementById('sheet-cover').value,
                details: document.getElementById('sheet-author-detail').value,
                genre: document.getElementById('sheet-genre').value,
                age_rating: document.getElementById('sheet-age').value,
                rating: parseInt(document.getElementById('sheet-rating').value),
                content: document.getElementById('sheet-synopsis').value,
                review: document.getElementById('sheet-review').value,
                author: currentUsername,
                category: 'community'
            };

            const { data, error } = await supabase.from('topics').insert([newSheet]).select();

            if (error) {
                alert("Erreur lors de la création de la fiche : " + error.message);
            } else {
                alert("Fiche créée avec succès !");
                document.getElementById('form-create-sheet').reset();
                formContainer.style.display = 'none';
                loadSheets();
            }
        });

        loadSheets();
    </script>
</body>
</html>
