<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche - Forum Actu Manga</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Style pour le formulaire de modification rapide */
        .edit-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .edit-modal-content {
            background: #fff;
            padding: 20px;
            width: 500px;
            max-width: 90%;
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
        }
        .edit-modal-content label {
            display: block;
            margin-top: 10px;
            font-size: 12px;
            font-weight: bold;
            color: #2c3e50;
        }
        .edit-modal-content input, .edit-modal-content textarea, .edit-modal-content select {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
            border: 1px solid #bdc3c7;
            border-radius: 3px;
            font-size: 12px;
        }
        .sheet-container {
            background: #fff;
            border: 1px solid #f8bbd0;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .sheet-header {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .sheet-cover {
            width: 130px;
            height: 180px;
            object-fit: cover;
            border: 1px solid #ccc;
            background: #eee;
            border-radius: 4px;
        }
        .sheet-info {
            flex: 1;
        }
        .badge {
            background: #f39c12;
            color: white;
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 3px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge.manga { background: #e84393; }
        .badge.anime { background: #0984e3; }
        .badge.game { background: #00b894; }
        .sheet-section {
            margin-top: 20px;
        }
        .sheet-section h3 {
            border-bottom: 1px dashed #f8bbd0;
            padding-bottom: 5px;
            color: #c2185b;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="wrapper">
        <div class="breadcrumb">
            <a href="index.html">Index du Forum</a> &raquo; <a href="community.html">Fiches & Critiques</a> &raquo; <span id="bread-title">Fiche</span>
        </div>

        <div class="sheet-container">
            <!-- EN-TÊTE DE LA FICHE -->
            <div class="sheet-header">
                <img id="sheet-cover" src="" alt="Affiche" class="sheet-cover">
                <div class="sheet-info">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span id="sheet-badge" class="badge">TYPE</span>
                        <!-- Boutons d'administration -->
                        <div id="admin-actions" style="display: none; gap: 5px;">
                            <button onclick="openEditModal()" style="background: #f39c12; color: white; border: none; padding: 4px 8px; font-size: 11px; cursor: pointer; border-radius: 3px;">Modifier</button>
                            <button onclick="deleteSheet()" style="background: #e74c3c; color: white; border: none; padding: 4px 8px; font-size: 11px; cursor: pointer; border-radius: 3px;">Supprimer</button>
                        </div>
                    </div>

                    <h1 id="sheet-title" style="margin-top: 5px; font-size: 20px; color: #c2185b;">Chargement...</h1>
                    <p><strong>Auteur / Studio :</strong> <span id="sheet-author">-</span></p>
                    <p><strong>Genre :</strong> <span id="sheet-genre">-</span></p>
                    <p><strong>Tranche d'âge :</strong> <span id="sheet-age" style="color: #e74c3c; font-weight: bold;">-</span></p>
                    <p><strong>Note globale :</strong> <span id="sheet-rating" style="color: #f1c40f;">-</span></p>
                    <p><strong>Fiche créée par :</strong> <span id="sheet-creator">-</span></p>
                </div>
            </div>

            <!-- CONTENU DE LA FICHE -->
            <div class="sheet-body">
                <div class="sheet-section">
                    <h3>📖 Synopsis / Résumé</h3>
                    <p id="sheet-synopsis" style="font-size: 13px; color: #2c3e50; line-height: 1.5;">-</p>
                </div>

                <div class="sheet-section">
                    <h3>💬 Avis personnel de l'auteur</h3>
                    <p id="sheet-review" style="font-size: 13px; color: #2c3e50; line-height: 1.5; font-style: italic;">-</p>
                </div>
            </div>
        </div>

        <!-- COMMENTAIRES -->
        <h2 style="font-size: 14px; margin-top: 25px; color: #2c3e50;">Avis des membres</h2>

        <div id="replies-list-container">
            <p style="font-size: 12px; color: #7f8c8d;">Chargement des avis...</p>
        </div>

        <!-- FORMULAIRE POUR RÉPONDRE -->
        <div class="reply-box" style="background: #fff; border: 1px solid #3498db; padding: 15px; border-radius: 5px; margin-top: 20px;">
            <div class="box-title" style="background: #3498db; color: white; padding: 8px; font-weight: bold; margin-bottom: 10px;">Donner ton avis</div>
            <form id="form-add-reply">
                <textarea id="reply-content" rows="4" placeholder="Qu'as-tu pensé de cette œuvre ?" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
                <button type="submit" class="btn-submit" style="margin-top: 10px; background: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer;">Poster mon avis</button>
            </form>
        </div>

    </div>

    <!-- MODALE DE MODIFICATION DE FICHE -->
    <div id="editModal" class="edit-modal">
        <div class="edit-modal-content">
            <h3 style="margin-top: 0; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px;">Modifier la Fiche</h3>
            <form id="editForm">
                <label>Titre de l'œuvre :</label>
                <input type="text" id="edit-title" required>

                <label>Type de Fiche :</label>
                <select id="edit-type">
                    <option value="manga">Manga</option>
                    <option value="anime">Anime</option>
                    <option value="game">Jeu Vidéo</option>
                </select>

                <label>URL de l'affiche / image :</label>
                <input type="url" id="edit-cover" required>

                <label>Auteur / Studio :</label>
                <input type="text" id="edit-author" required>

                <label>Genre :</label>
                <input type="text" id="edit-genre" required>

                <label>Tranche d'âge :</label>
                <select id="edit-age">
                    <option value="Tous publics">Tous publics</option>
                    <option value="10 ans et +">10 ans et +</option>
                    <option value="12 ans et +">12 ans et +</option>
                    <option value="16 ans et +">16 ans et +</option>
                    <option value="18 ans et +">18 ans et +</option>
                </select>

                <label>Note (1 à 5 étoiles) :</label>
                <select id="edit-rating">
                    <option value="5">5</option>
                    <option value="4">4</option>
                    <option value="3">3</option>
                    <option value="2">2</option>
                    <option value="1">1</option>
                </select>

                <label>Synopsis / Résumé :</label>
                <textarea id="edit-synopsis" rows="4" required></textarea>

                <label>Avis personnel :</label>
                <textarea id="edit-review" rows="3" required></textarea>

                <div style="margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" onclick="closeEditModal()" style="background: #95a5a6; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 3px;">Annuler</button>
                    <button type="submit" style="background: #27ae60; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 3px;">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT DE CHARGEMENT ET SUPABASE -->
    <script type="module">
        import { supabase } from './supabase.js';

        const urlParams = new URLSearchParams(window.location.search);
        const sheetId = urlParams.get('id');
        const currentUsername = localStorage.getItem('forumUsername');
        const defaultCover = "https://i.pinimg.com/236x/88/33/1b/88331b1516e0535e6a2d1d36d338f08a.jpg";

        let currentSheetData = null;

        async function loadSheet() {
            if (!sheetId) {
                document.getElementById('wrapper').innerHTML = "<h2 style='text-align:center; margin-top:50px;'>Fiche introuvable (ID manquant).</h2>";
                return;
            }

            const { data: topic, error } = await supabase
                .from('topics')
                .select('*')
                .eq('id', sheetId)
                .single();

            if (error || !topic) {
                document.getElementById('wrapper').innerHTML = "<h2 style='text-align:center; margin-top:50px;'>Cette fiche n'existe plus ou a été supprimée.</h2>";
                return;
            }

            currentSheetData = topic;

            // Remplissage des champs de la page
            document.getElementById('sheet-title').textContent = topic.title;
            document.getElementById('bread-title').textContent = topic.title;
            document.getElementById('sheet-cover').src = topic.cover_url || defaultCover;
            document.getElementById('sheet-author').textContent = topic.details || 'Non renseigné';
            document.getElementById('sheet-genre').textContent = topic.genre || 'Non renseigné';
            document.getElementById('sheet-age').textContent = topic.age_rating || 'Tous publics';

            let ratingNum = topic.rating || 5;
            let stars = "⭐".repeat(ratingNum) + ` (${ratingNum}/5)`;
            document.getElementById('sheet-rating').textContent = stars;

            let authorName = topic.author || 'Anonyme';
            let authorClass = (authorName === 'Admin_Otaku' || authorName === 'Otaku_33') ? 'group-admin' : 'group-member';
            document.getElementById('sheet-creator').innerHTML = `<a href="profile.html?user=${encodeURIComponent(authorName)}" class="${authorClass}">${authorName}</a>`;

            document.getElementById('sheet-synopsis').textContent = topic.content || 'Aucun synopsis.';
            document.getElementById('sheet-review').textContent = topic.review || 'Aucun avis personnel.';

            let sheetType = topic.sheet_type || 'manga';
            let typeLabels = { manga: "📖 MANGA", anime: "📺 ANIME", game: "🎮 JEU VIDÉO" };
            let badge = document.getElementById('sheet-badge');
            badge.textContent = typeLabels[sheetType] || "📖 MANGA";
            badge.className = `badge ${sheetType}`;

            // Afficher les boutons d'administration si c'est l'auteur ou l'admin
            if (localStorage.getItem('isAdmin') === 'true' || (currentUsername && currentUsername === topic.author)) {
                document.getElementById('admin-actions').style.display = 'flex';
            }

            loadReplies();
        }

        async function loadReplies() {
            const container = document.getElementById('replies-list-container');

            const { data: replies, error } = await supabase
                .from('replies')
                .select('*')
                .eq('topic_id', sheetId)
                .order('created_at', { ascending: true });

            if (error || !replies || replies.length === 0) {
                container.innerHTML = `<p style="font-size: 12px; color: #7f8c8d; padding: 10px; background: #fff; border: 1px solid #f8bbd0;">Aucun avis pour le moment. Soyez le premier à donner le vôtre !</p>`;
                return;
            }

            container.innerHTML = replies.map(r => {
                let isAdm = (r.author === 'Admin_Otaku' || r.author === 'Otaku_33');
                let rClass = isAdm ? 'group-admin' : 'group-member';
                let rRank = isAdm ? 'Fondateur' : 'Membre';

                return `
                    <div class="post-box" style="margin-bottom: 10px;">
                        <div class="post-user">
                            <a href="profile.html?user=${encodeURIComponent(r.author)}" class="username ${rClass}">${r.author}</a>
                            <div class="user-rank">${rRank}</div>
                            <a href="profile.html?user=${encodeURIComponent(r.author)}">
                                <img src="https://i.pinimg.com/236x/88/33/1b/88331b1516e0535e6a2d1d36d338f08a.jpg" alt="Avatar" class="user-avatar">
                            </a>
                        </div>
                        <div class="post-content">
                            <div class="post-date">Posté le ${new Date(r.created_at).toLocaleString()}</div>
                            <div class="post-text">
                                <p>${r.content}</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Poster un avis
        document.getElementById('form-add-reply').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUsername) {
                alert("Vous devez être connecté pour poster un avis !");
                window.location.href = "register.html";
                return;
            }

            const content = document.getElementById('reply-content').value;

            const { error } = await supabase.from('replies').insert([
                { topic_id: sheetId, author: currentUsername, content: content }
            ]);

            if (error) {
                alert("Erreur lors de l'envoi de l'avis : " + error.message);
            } else {
                document.getElementById('reply-content').value = "";
                loadReplies();
            }
        });

        // Suppression de la fiche
        window.deleteSheet = async function() {
            if (confirm("Voulez-vous vraiment supprimer cette fiche ?")) {
                const { error } = await supabase.from('topics').delete().eq('id', sheetId);
                if (error) {
                    alert("Erreur lors de la suppression : " + error.message);
                } else {
                    alert("Fiche supprimée avec succès !");
                    window.location.href = "community.html";
                }
            }
        }

        // Gestion de la modale d'édition
        window.openEditModal = function() {
            if (!currentSheetData) return;
            document.getElementById('edit-title').value = currentSheetData.title || '';
            document.getElementById('edit-type').value = currentSheetData.sheet_type || 'manga';
            document.getElementById('edit-cover').value = currentSheetData.cover_url || '';
            document.getElementById('edit-author').value = currentSheetData.details || '';
            document.getElementById('edit-genre').value = currentSheetData.genre || '';
            document.getElementById('edit-age').value = currentSheetData.age_rating || 'Tous publics';
            document.getElementById('edit-rating').value = currentSheetData.rating || 5;
            document.getElementById('edit-synopsis').value = currentSheetData.content || '';
            document.getElementById('edit-review').value = currentSheetData.review || '';

            document.getElementById('editModal').style.display = 'flex';
        }

        window.closeEditModal = function() {
            document.getElementById('editModal').style.display = 'none';
        }

        // Sauvegarde des modifications dans Supabase
        document.getElementById('editForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const updatedData = {
                title: document.getElementById('edit-title').value,
                sheet_type: document.getElementById('edit-type').value,
                cover_url: document.getElementById('edit-cover').value,
                details: document.getElementById('edit-author').value,
                genre: document.getElementById('edit-genre').value,
                age_rating: document.getElementById('edit-age').value,
                rating: parseInt(document.getElementById('edit-rating').value),
                content: document.getElementById('edit-synopsis').value,
                review: document.getElementById('edit-review').value
            };

            const { error } = await supabase
                .from('topics')
                .update(updatedData)
                .eq('id', sheetId);

            if (error) {
                alert("Erreur lors de la mise à jour : " + error.message);
            } else {
                alert("Fiche modifiée avec succès !");
                closeEditModal();
                loadSheet();
            }
        });

        loadSheet();
    </script>

</body>
</html>
