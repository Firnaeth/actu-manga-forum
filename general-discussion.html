<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone Gaming - Forum Actu Manga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="wrapper">

        <!-- BANNIÈRE EN-TÊTE -->
        <div class="main-header">
            <img src="https://images.alphacoders.com/605/605592.png" alt="Bannière Forum Manga" class="header-banner">
        </div>

        <!-- BARRE DE NAVIGATION VINTAGE -->
        <nav class="forum-nav">
            <a href="index.html" class="nav-link">Index</a>
            <a href="community.html" class="nav-link">Fiches & Critiques</a>
            <a href="contest-view.html" class="nav-link">Concours Dessin</a>
            <a href="#" class="nav-link">Rechercher</a>
            <a href="profile.html" id="nav-profile-link" class="nav-link hidden">Mon Profil</a>
            <a href="register.html" id="nav-auth-link" class="nav-link highlight">S'enregistrer</a>
        </nav>

        <!-- CONTENU PRINCIPAL GAMING -->
        <div class="news-container">
            <div class="welcome-banner">
                <h2>_ Zone Détente & Discussions Diverses _</h2>
                <p>Pour parler de tout et de rien entre membres : ciné, musique, vie quotidienne...</p>
            </div>

            <!-- BOUTON CRÉER UN SUJET -->
            <div style="margin-bottom: 20px;">
                <button id="btn-open-topic-modal" class="btn-admin-edit" style="padding: 10px 15px; cursor: pointer;">+ Créer un nouveau sujet</button>
            </div>

            <!-- LISTE DES SUJETS GAMING -->
            <table class="forum-table">
                <thead>
                    <tr>
                        <th colspan="2" class="cat-title">_ Sujets de discussion _</th>
                        <th class="stat-head">Auteur</th>
                        <th class="stat-head">Réponses</th>
                        <th class="last-post-head">Date</th>
                    </tr>
                </thead>
                <tbody id="general-topics-list">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 20px;">Chargement des sujets...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- MODALE CRÉATION DE SUJET -->
        <div id="topic-modal" class="admin-panel-inputs hidden" style="margin-top: 20px; border: 1px solid #ccc; padding: 15px; background: #fff;">
            <h3>Créer un nouveau sujet</h3>
            <form id="form-create-topic">
                <label>Titre du sujet :</label>
                <input type="text" id="input-topic-title" required style="width: 100%; margin-bottom: 10px;">

                <label>Message / Contenu :</label>
                <textarea id="input-topic-content" rows="5" required style="width: 100%; margin-bottom: 10px;"></textarea>

                <div class="admin-form-actions">
                    <button type="submit" class="btn-admin-edit">Publier</button>
                    <button type="button" class="btn-admin-edit btn-cancel" id="btn-close-topic-modal">Annuler</button>
                </div>
            </form>
        </div>

    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        const currentUsername = localStorage.getItem('forumUsername');

        // GESTION CONNEXION NAVBAR
        const profileLink = document.getElementById('nav-profile-link');
        const authLink = document.getElementById('nav-auth-link');
        if (currentUsername) {
            profileLink.classList.remove('hidden');
            authLink.textContent = "Déconnexion";
            authLink.onclick = async () => { await supabase.auth.signOut(); localStorage.clear(); window.location.reload(); };
        }

        // GESTION MODALE CRÉATION
        const modal = document.getElementById('topic-modal');
        document.getElementById('btn-open-topic-modal').addEventListener('click', () => {
            if (!currentUsername) {
                alert("Vous devez être connecté pour créer un sujet !");
                window.location.href = "register.html";
                return;
            }
            modal.classList.toggle('hidden');
        });
        document.getElementById('btn-close-topic-modal').addEventListener('click', () => {
            modal.classList.add('hidden');
        });

        // CHARGEMENT DES SUJETS DÉTENTE DEPUIS SUPABASE
        async function loadGamingTopics() {
            const tbody = document.getElementById('general-topics-list'); // Assure-toi que ton <tbody> dans le HTML a cet ID
            
            // On récupère les sujets filtrés par la catégorie "general"
            const { data: topics, error } = await supabase
                .from('topics')
                .select('*')
                .eq('category', 'general') // On change le filtre pour "general"
                .order('created_at', { ascending: false });

            if (error) {
                // Si la table ou la catégorie n'est pas encore remplie, on affiche un message propre
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 20px;">Aucun sujet pour le moment. Soyez le premier à en créer un !</td></tr>`;
                return;
            }

            if (!topics || topics.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 20px;">Aucun sujet pour le moment. Soyez le premier à en créer un !</td></tr>`;
                return;
            }

            tbody.innerHTML = topics.map(topic => `
                <tr>
                    <td class="icon-cell"><span class="category-emoji">💬</span></td>
                    <td class="forum-desc">
                        <a href="topic-view.html?id=${topic.id}" class="forum-title">${topic.title}</a>
                        <p>${topic.content ? topic.content.substring(0, 80) + '...' : ''}</p>
                    </td>
                    <td class="stat-cell">${topic.author || 'Anonyme'}</td>
                    <td class="stat-cell">${topic.replies_count || 0}</td>
                    <td class="last-post-cell">${new Date(topic.created_at).toLocaleDateString()}</td>
                </tr>
            `).join('');
        }

        // SOUMISSION D'UN NOUVEAU SUJET
        document.getElementById('form-create-topic').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('input-topic-title').value;
            const content = document.getElementById('input-topic-content').value;

            const { error } = await supabase.from('topics').insert([
                { title, content, category: 'gaming', author: currentUsername }
            ]);

            if (error) {
                alert("Erreur lors de la création du sujet : " + error.message);
            } else {
                alert("Sujet créé avec succès !");
                window.location.reload();
            }
        });

        loadGamingTopics();
    </script>
</body>
</html>
