<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Forum Actu Manga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="wrapper">
        <div class="breadcrumb">
            <a href="index.html">Index du Forum</a> &raquo; Profil de <span id="bread-username">Chargement...</span>
        </div>

        <div class="profile-container">
            <div class="profile-header">
                <div class="avatar-box">
                    <img id="user-avatar" src="" alt="Avatar">
                </div>
                <div class="user-title">
                    <h2 id="user-name">-</h2>
                    <div class="rank" id="user-rank">-</div>
                </div>
            </div>

            <table class="info-table">
                <tr>
                    <td class="label-col">Date d'inscription :</td>
                    <td id="user-joined">-</td>
                </tr>
                <tr>
                    <td class="label-col">Manga favori :</td>
                    <td id="user-fav">-</td>
                </tr>
                <tr>
                    <td class="label-col">Signature :</td>
                    <td id="user-sig"><em>-</em></td>
                </tr>
            </table>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        const currentUsername = localStorage.getItem('forumUsername');
        const urlParams = new URLSearchParams(window.location.search);
        const profileUser = urlParams.get('user') || currentUsername;

        if (!profileUser) {
            alert("Veuillez vous connecter pour voir votre profil.");
            window.location.href = "register.html";
        }

        async function loadProfile() {
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('username', profileUser)
                .single();

            if (error || !profile) {
                document.getElementById('user-name').textContent = "Utilisateur introuvable";
                return;
            }

            document.getElementById('bread-username').textContent = profile.username;
            document.getElementById('user-name').textContent = profile.username;
            document.getElementById('user-rank').textContent = profile.role === 'admin' ? 'Administrateur' : 'Membre';
            document.getElementById('user-joined').textContent = new Date(profile.created_at).toLocaleDateString('fr-FR');
            document.getElementById('user-fav').textContent = profile.favorite_manga || 'Non renseigné';
            document.getElementById('user-sig').innerHTML = `<em>${profile.signature || ''}</em>`;
            document.getElementById('user-avatar').src = profile.avatar_url;
        }

        loadProfile();
    </script>
</body>
</html>
