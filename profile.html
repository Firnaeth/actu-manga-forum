<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Forum Actu Manga</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* AJUSTEMENT AUTOMATIQUE DU CADRE D'AVATAR À L'IMAGE */
        .avatar-box {
            display: inline-block;
            width: auto !important;
            height: auto !important;
            max-width: 220px; /* Limite maximale pour éviter les images géantes */
            max-height: 300px;
            padding: 5px;
            background: #fff;
            border: 1px solid #ffb6c1;
            border-radius: 4px;
        }
        .avatar-box img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 2px;
        }

        .edit-profile-box {
            background: #fff;
            border: 1px solid #ffb6c1;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .edit-profile-title {
            font-weight: bold;
            color: #d63384;
            margin-bottom: 10px;
            border-bottom: 1px dashed #ffb6c1;
            padding-bottom: 5px;
        }
        .edit-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .edit-form-grid input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        .full-width {
            grid-column: span 2;
        }
        .btn-save-profile {
            background: #ff80ab;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-save-profile:hover {
            background: #ff4081;
        }
    </style>
</head>
<body>

    <div id="wrapper">
        <!-- BREADCRUMB -->
        <div class="breadcrumb">
            <a href="index.html">Index du Forum</a> &raquo; Profil de <span id="bread-username">Membre</span>
        </div>

        <!-- CARTE PROFIL -->
        <div class="profile-container">
            <div class="profile-header">
                <div class="avatar-box">
                    <img id="user-avatar" src="https://i.pinimg.com/236x/d9/1b/2e/d91b2e2b34a6210f22ef2f8bb7df5f06.jpg" alt="Avatar">
                </div>
                <div class="user-title">
                    <h2 id="user-name">Membre</h2>
                    <div class="rank" id="user-rank">Membre</div>
                </div>
            </div>

            <table class="info-table">
                <tr>
                    <td class="label-col">Date d'inscription :</td>
                    <td id="user-joined">-</td>
                </tr>
                <tr>
                    <td class="label-col">Nombre de messages :</td>
                    <td id="user-posts">0 message</td>
                </tr>
                <tr>
                    <td class="label-col">Manga favori :</td>
                    <td id="user-fav">-</td>
                </tr>
                <tr>
                    <td class="label-col">Signature :</td>
                    <td id="user-sig"><em>-</em></td>
                </tr>
            </table>

            <div class="mp-box">
                <a href="#" class="btn-mp">Envoyer un Message Privé (MP)</a>
            </div>
        </div>

        <!-- BLOC DE MODIFICATION (UNIQUEMENT POUR LE PROPRIÉTAIRE) -->
        <div id="edit-profile-section" class="edit-profile-box" style="display: none;">
            <div class="edit-profile-title">✏️ Modifier mes informations de profil</div>
            <form id="form-edit-profile">
                <div class="edit-form-grid">
                    <div>
                        <label><small>Lien de l'avatar (URL Image) :</small></label>
                        <input type="url" id="edit-avatar-url" placeholder="https://..." required>
                    </div>
                    <div>
                        <label><small>Manga(s) favori(s) :</small></label>
                        <input type="text" id="edit-fav-manga" placeholder="Ex: Bleach, Naruto...">
                    </div>
                    <div class="full-width">
                        <label><small>Signature (Lien d'image ou texte) :</small></label>
                        <input type="text" id="edit-signature" placeholder="https://... ou votre texte">
                    </div>
                </div>
                <button type="submit" class="btn-save-profile">Enregistrer les modifications</button>
            </form>
        </div>

        <!-- MANGATHÈQUE -->
        <div class="manga-section">
            <div class="manga-header">
                📊 Mangathèque de <span id="mangatheque-owner">Membre</span> (<span id="total-volumes-count">0</span> tomes)
            </div>
            <div class="manga-content">
                <!-- FORMULAIRE D'AJOUT -->
                <div id="add-manga-box">
                    <form class="add-manga-form" id="form-add-manga">
                        <input type="text" id="manga-title-input" class="input-flex-2" placeholder="Titre du manga (ex: Bleach)" required>
                        <input type="number" id="manga-count-input" class="input-flex-1" placeholder="Nb tomes" min="1" required>
                        <button type="submit" class="btn-mp btn-add-padding">+ Ajouter</button>
                    </form>
                </div>

                <!-- LISTE DES MANGAS -->
                <div class="manga-grid" id="manga-list-container">
                    <!-- Injecté par JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT DYNAMIQUE AVEC SUPABASE -->
    <script type="module">
        import { supabase } from './supabase.js';

        const currentUsername = localStorage.getItem('forumUsername');
        const urlParams = new URLSearchParams(window.location.search);
        const profileUser = urlParams.get('user') || currentUsername;

        if (!currentUsername && !urlParams.get('user')) {
            alert("Vous devez être connecté pour consulter un profil !");
            window.location.href = "register.html";
        }

        let currentUserId = null;

        // Charger les données de l'utilisateur depuis Supabase
        async function loadUserProfile() {
            document.getElementById('bread-username').textContent = profileUser;
            document.getElementById('user-name').textContent = profileUser;
            document.getElementById('mangatheque-owner').textContent = profileUser;

            const { data: profile, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('username', profileUser)
                .single();

            if (profile) {
                currentUserId = profile.id;
                document.getElementById('user-rank').textContent = profile.rank || (profile.role === 'admin' ? 'Administrateur' : 'Membre');
                document.getElementById('user-joined').textContent = profile.created_at ? new Date(profile.created_at).toLocaleDateString() : 'Récemment';
                document.getElementById('user-fav').textContent = profile.favorite_manga || 'Non spécifié';
                
                // Transformation automatique du lien de signature en image s'il commence par http
                const sigCell = document.getElementById('user-sig');
                if (profile.signature) {
                    if (profile.signature.startsWith('http://') || profile.signature.startsWith('https://')) {
                        sigCell.innerHTML = `<img src="${profile.signature}" alt="Signature" style="max-width: 100%; height: auto; display: block; margin-top: 5px;">`;
                    } else {
                        sigCell.textContent = profile.signature;
                    }
                } else {
                    sigCell.innerHTML = '<em>-</em>';
                }
                
                if (profile.avatar_url) {
                    document.getElementById('user-avatar').src = profile.avatar_url;
                }

                // Si c'est notre propre profil, afficher le formulaire d'édition
                if (profileUser === currentUsername) {
                    document.getElementById('edit-profile-section').style.display = 'block';
                    document.getElementById('edit-avatar-url').value = profile.avatar_url || '';
                    document.getElementById('edit-fav-manga').value = profile.favorite_manga || '';
                    document.getElementById('edit-signature').value = profile.signature || '';
                }
            }
        }

        // Sauvegarder les modifications de profil dans Supabase
        document.getElementById('form-edit-profile').addEventListener('submit', async (e) => {
            e.preventDefault();
            const avatarUrl = document.getElementById('edit-avatar-url').value;
            const favManga = document.getElementById('edit-fav-manga').value;
            const signature = document.getElementById('edit-signature').value;

            const { error } = await supabase
                .from('profiles')
                .update({
                    avatar_url: avatarUrl,
                    favorite_manga: favManga,
                    signature: signature
                })
                .eq('username', currentUsername);

            if (error) {
                alert("Erreur lors de la mise à jour : " + error.message);
            } else {
                alert("Profil mis à jour avec succès !");
                location.reload();
            }
        });

        // Masquer le formulaire d'ajout manga si ce n'est pas le propriétaire
        if (profileUser !== currentUsername) {
            document.getElementById('add-manga-box').style.display = 'none';
        }

        // Gestion de la Mangathèque (Local / Supabase)
        const defaultMangas = {
            "Otaku_33": [{ id: 1, title: "Bleach", count: 636 }]
        };

        if (!localStorage.getItem('forumMangatheques')) {
            localStorage.setItem('forumMangatheques', JSON.stringify(defaultMangas));
        }

        const allMangatheques = JSON.parse(localStorage.getItem('forumMangatheques'));
        let userMangaList = allMangatheques[profileUser] || [];

        function renderMangatheque() {
            const container = document.getElementById('manga-list-container');
            const totalCounter = document.getElementById('total-volumes-count');

            if (userMangaList.length === 0) {
                container.innerHTML = '<p class="empty-manga-msg">Aucun manga dans la collection.</p>';
                totalCounter.textContent = "0";
                return;
            }

            let total = 0;
            container.innerHTML = userMangaList.map(item => {
                total += parseInt(item.count);
                const isOwner = profileUser === currentUsername;
                return `
                    <div class="manga-item">
                        <div class="manga-info">
                            <strong>${item.title}</strong>
                            <div class="volume-counter">
                                📖 <span>${item.count} tomes</span>
                                ${isOwner ? `
                                    <button class="btn-qty" data-id="${item.id}" data-action="minus">-</button>
                                    <button class="btn-qty" data-id="${item.id}" data-action="plus">+</button>
                                ` : ''}
                            </div>
                        </div>
                        ${isOwner ? `
                            <button class="btn-del" data-id="${item.id}" data-action="delete">x</button>
                        ` : ''}
                    </div>
                `;
            }).join('');

            totalCounter.textContent = total;
            attachMangathequeEvents();
        }

        function attachMangathequeEvents() {
            document.querySelectorAll('.btn-qty').forEach(btn => {
                btn.onclick = function() {
                    const id = parseInt(this.getAttribute('data-id'));
                    const action = this.getAttribute('data-action');
                    updateCount(id, action === 'plus' ? 1 : -1);
                };
            });

            document.querySelectorAll('.btn-del').forEach(btn => {
                btn.onclick = function() {
                    const id = parseInt(this.getAttribute('data-id'));
                    removeManga(id);
                };
            });
        }

        document.getElementById('form-add-manga').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('manga-title-input').value;
            const count = parseInt(document.getElementById('manga-count-input').value);

            userMangaList.push({ id: Date.now(), title: title, count: count });
            saveAndRender();

            document.getElementById('manga-title-input').value = '';
            document.getElementById('manga-count-input').value = '';
        });

        function updateCount(id, change) {
            const manga = userMangaList.find(m => m.id === id);
            if (manga) {
                manga.count += change;
                if (manga.count < 1) manga.count = 1;
                saveAndRender();
            }
        }

        function removeManga(id) {
            userMangaList = userMangaList.filter(item => item.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            allMangatheques[profileUser] = userMangaList;
            localStorage.setItem('forumMangatheques', JSON.stringify(allMangatheques));
            renderMangatheque();
        }

        loadUserProfile();
        renderMangatheque();
    </script>
</body>
</html>
