<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Forum Actu Manga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="wrapper">
        <!-- BREADCRUMB -->
        <div class="breadcrumb">
            <a href="index.html">Index du Forum</a> &raquo; Profil de <span id="bread-username">Membre</span>
        </div>

        <!-- CARTE PROFIL -->
        <div class="profile-container">
            <div class="profile-header">
                <div class="avatar-box">
                    <img id="user-avatar" src="" alt="Avatar">
                </div>
                <div class="user-title">
                    <h2 id="user-name">Membre</h2>
                    <div class="rank" id="user-rank">Membre</div>
                </div>
            </div>

            <table class="info-table">
                <tr>
                    <td class="label-col">Date d'inscription :</td>
                    <td id="user-joined">-</td>
                </tr>
                <tr>
                    <td class="label-col">Nombre de messages :</td>
                    <td id="user-posts">0 message</td>
                </tr>
                <tr>
                    <td class="label-col">Manga favori :</td>
                    <td id="user-fav">-</td>
                </tr>
                <tr>
                    <td class="label-col">Signature :</td>
                    <td id="user-sig"><em>-</em></td>
                </tr>
            </table>

            <div class="mp-box">
                <a href="#" class="btn-mp">Envoyer un Message Privé (MP)</a>
            </div>
        </div>

        <!-- MANGATHÈQUE -->
        <div class="manga-section">
            <div class="manga-header">
                📊 Mangathèque de <span id="mangatheque-owner">Membre</span> (<span id="total-volumes-count">0</span> tomes)
            </div>
            <div class="manga-content">
                <!-- FORMULAIRE D'AJOUT -->
                <div id="add-manga-box">
                    <form class="add-manga-form" id="form-add-manga">
                        <input type="text" id="manga-title-input" class="input-flex-2" placeholder="Titre du manga (ex: Bleach)" required>
                        <input type="number" id="manga-count-input" class="input-flex-1" placeholder="Nb tomes" min="1" required>
                        <button type="submit" class="btn-mp btn-add-padding">+ Ajouter</button>
                    </form>
                </div>

                <!-- LISTE DES MANGAS -->
                <div class="manga-grid" id="manga-list-container">
                    <!-- Injecté par JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT DYNAMIQUE & SÉCURITÉ -->
    <script>
        const currentUsername = localStorage.getItem('forumUsername');
        const urlParams = new URLSearchParams(window.location.search);
        const profileUser = urlParams.get('user') || currentUsername;

        // --- BLOQUER L'ACCÈS SI NON CONNECTÉ ---
        if (!currentUsername && !urlParams.get('user')) {
            alert("Vous devez être connecté ou inscrit pour consulter un profil !");
            window.location.href = "register.html";
        }

        const usersInfo = {
            "Admin_Otaku": {
                rank: "Administrateur / Fondateur",
                joined: "15 Janvier 2026",
                posts: "1 420 messages",
                fav: "Monster / Berserk / Nana",
                sig: "« Je serai le Roi des Pirates ! »",
                avatar: "https://i.pinimg.com/236x/88/33/1b/88331b1516e0535e6a2d1d36d338f08a.jpg"
            },
            "Yoru_Chan": {
                rank: "Membre Habitué",
                joined: "03 Mars 2026",
                posts: "89 messages",
                fav: "Chainsaw Man / Jujutsu Kaisen",
                sig: "Mangathèque en cours de remplissage...",
                avatar: "https://i.pinimg.com/236x/d9/1b/2e/d91b2e2b34a6210f22ef2f8bb7df5f06.jpg"
            }
        };

        const userData = usersInfo[profileUser] || {
            rank: "Membre",
            joined: "Récemment",
            posts: "1 message",
            fav: "Non spécifié",
            sig: "Abonné au forum.",
            avatar: "https://i.pinimg.com/236x/d9/1b/2e/d91b2e2b34a6210f22ef2f8bb7df5f06.jpg"
        };

        document.getElementById('bread-username').textContent = profileUser || 'Inconnu';
        document.getElementById('user-name').textContent = profileUser || 'Inconnu';
        document.getElementById('mangatheque-owner').textContent = profileUser || 'Inconnu';
        document.getElementById('user-rank').textContent = userData.rank;
        document.getElementById('user-joined').textContent = userData.joined;
        document.getElementById('user-posts').textContent = userData.posts;
        document.getElementById('user-fav').textContent = userData.fav;
        document.getElementById('user-sig').innerHTML = `<em>${userData.sig}</em>`;
        document.getElementById('user-avatar').src = userData.avatar;

        // Cacher le formulaire d'ajout si le profil consulté n'est pas celui de l'utilisateur connecté
        if (profileUser !== currentUsername) {
            document.getElementById('add-manga-box').style.display = 'none';
        }

        const defaultMangas = {
            "Admin_Otaku": [
                { id: 1, title: "Bleach", count: 636 }
            ],
            "Yoru_Chan": [
                { id: 1, title: "Chainsaw Man", count: 15 },
                { id: 2, title: "Jujutsu Kaisen", count: 23 }
            ]
        };

        if (!localStorage.getItem('forumMangatheques')) {
            localStorage.setItem('forumMangatheques', JSON.stringify(defaultMangas));
        }

        const allMangatheques = JSON.parse(localStorage.getItem('forumMangatheques'));
        let userMangaList = allMangatheques[profileUser] || [];

        function renderMangatheque() {
            const container = document.getElementById('manga-list-container');
            const totalCounter = document.getElementById('total-volumes-count');

            if (userMangaList.length === 0) {
                container.innerHTML = '<p class="empty-manga-msg">Aucun manga dans la collection.</p>';
                totalCounter.textContent = "0";
                return;
            }

            let total = 0;
            container.innerHTML = userMangaList.map(item => {
                total += parseInt(item.count);
                const isOwner = profileUser === currentUsername;
                return `
                    <div class="manga-item">
                        <div class="manga-info">
                            <strong>${item.title}</strong>
                            <div class="volume-counter">
                                📖 <span>${item.count} tomes</span>
                                ${isOwner ? `
                                    <button class="btn-qty" onclick="updateCount(${item.id}, -1)">-</button>
                                    <button class="btn-qty" onclick="updateCount(${item.id}, 1)">+</button>
                                ` : ''}
                            </div>
                        </div>
                        ${isOwner ? `
                            <button class="btn-del" onclick="removeManga(${item.id})">x</button>
                        ` : ''}
                    </div>
                `;
            }).join('');

            totalCounter.textContent = total;
        }

        document.getElementById('form-add-manga').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('manga-title-input').value;
            const count = parseInt(document.getElementById('manga-count-input').value);

            userMangaList.push({ id: Date.now(), title: title, count: count });
            saveAndRender();

            document.getElementById('manga-title-input').value = '';
            document.getElementById('manga-count-input').value = '';
        });

        function updateCount(id, change) {
            const manga = userMangaList.find(m => m.id === id);
            if (manga) {
                manga.count += change;
                if (manga.count < 1) manga.count = 1;
                saveAndRender();
            }
        }

        function removeManga(id) {
            userMangaList = userMangaList.filter(item => item.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            allMangatheques[profileUser] = userMangaList;
            localStorage.setItem('forumMangatheques', JSON.stringify(allMangatheques));
            renderMangatheque();
        }

        renderMangatheque();
    </script>
</body>
</html>
