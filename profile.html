<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S'enregistrer / Connexion - Forum Actu Manga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="wrapper">
        <div class="breadcrumb">
            <a href="index.html">Index du Forum</a> &raquo; Authentification
        </div>

        <div class="profile-container">
            <div class="profile-header">
                <h2>Rejoindre la Communauté / Se connecter</h2>
            </div>
            
            <div class="manga-content">
                <form id="form-auth" class="admin-panel-inputs">
                    <label>Adresse E-mail :</label>
                    <input type="email" id="auth-email" required placeholder="votre@email.com">

                    <label>Mot de passe :</label>
                    <input type="password" id="auth-password" required placeholder="******">

                    <label>Pseudo Forum (nécessaire pour l'inscription) :</label>
                    <input type="text" id="auth-username" placeholder="Ex: Otaku_99">

                    <div class="admin-form-actions" style="margin-top: 15px;">
                        <button type="button" id="btn-login" class="btn-mp">Se connecter</button>
                        <button type="button" id="btn-register" class="btn-admin-edit">S'inscrire</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        const emailInput = document.getElementById('auth-email');
        const passwordInput = document.getElementById('auth-password');
        const usernameInput = document.getElementById('auth-username');

        // INSCRIPTION
        document.getElementById('btn-register').addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const username = usernameInput.value.trim();

            if (!email || !password || !username) {
                alert("Veuillez remplir tous les champs !");
                return;
            }

            const { data, error } = await supabase.auth.signUp({ email, password });

            if (error) {
                alert("Erreur lors de l'inscription : " + error.message);
                return;
            }

            if (data.user) {
                const { error: profileError } = await supabase.from('profiles').insert([
                    { id: data.user.id, username: username, role: 'membre' }
                ]);

                if (profileError) {
                    alert("Compte créé mais erreur sur le profil : " + profileError.message);
                } else {
                    localStorage.setItem('forumUsername', username);
                    localStorage.setItem('forumUserRole', 'membre');
                    alert("Inscription réussie !");
                    window.location.href = "index.html";
                }
            }
        });

        // CONNEXION
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert("Erreur de connexion : " + error.message);
                return;
            }

            const { data: profile } = await supabase.from('profiles').select('username, role').eq('id', data.user.id).single();

            if (profile) {
                localStorage.setItem('forumUsername', profile.username);
                localStorage.setItem('forumUserRole', profile.role);
                alert("Connexion réussie !");
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
