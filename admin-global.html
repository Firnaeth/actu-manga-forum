<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration Globale - Actu Manga World</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="wrapper" style="max-width: 900px; margin: 20px auto; padding: 20px;">

        <a href="index.html" class="nav-link" style="display: inline-block; margin-bottom: 20px; text-decoration: none;">&larr; Retour à l'accueil</a>

        <div class="admin-edit-bar" style="margin-bottom: 20px;">
            <span class="admin-title-badge">⚙️ Panneau d'Administration Central</span>
        </div>

        <!-- ONGLETS : 1. ACCUEIL (GLOBAL) - 2. FAN CLUBS - 3. FORUMS -->
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button class="btn-admin-edit tab-btn active" onclick="switchTab('header')" id="btn-tab-header" style="background: #e0a899;">1. Accueil & En-tête</button>
            <button class="btn-admin-edit tab-btn" onclick="switchTab('fanclubs')" id="btn-tab-fanclubs">2. Fan Clubs</button>
            <button class="btn-admin-edit tab-btn" onclick="switchTab('forums')" id="btn-tab-forums">3. Gestion Forums</button>
        </div>

        <!-- 1. ACCUEIL ET EN-TÊTE -->
        <div id="tab-header" class="admin-tab-content">
            <div class="admin-panel-inputs" style="background: #fff; padding: 20px; border-radius: 6px; border: 1px solid #f5c2c7;">
                <h3>Configuration de l'Accueil</h3>
                <form id="form-config-header">
                    <label style="display:block; margin:10px 0 5px; font-weight:bold;">Titre du forum :</label>
                    <input type="text" id="input-forum-title" class="admin-form-control" style="width:100%; padding:8px; margin-bottom:15px;" required>
                    
                    <label style="display:block; margin:0 0 5px; font-weight:bold;">Sous-titre / Description :</label>
                    <input type="text" id="input-forum-subtitle" class="admin-form-control" style="width:100%; padding:8px; margin-bottom:15px;" required>
                    
                    <label style="display:block; margin:0 0 5px; font-weight:bold;">URL de la Bannière principale :</label>
                    <input type="url" id="input-forum-banner" class="admin-form-control" style="width:100%; padding:8px; margin-bottom:15px;" required>
                    
                    <button type="submit" class="btn-admin-edit">Enregistrer les modifications Accueil</button>
                </form>
            </div>
        </div>

        <!-- 2. FAN CLUBS -->
        <div id="tab-fanclubs" class="admin-tab-content" style="display: none;">
            <div class="admin-panel-inputs" style="background: #fff; padding: 20px; border-radius: 6px; border: 1px solid #f5c2c7; margin-bottom: 20px;">
                <h3>Gestion des Bannières Fan Clubs</h3>
                <form id="form-fanclub-banner">
                    <label style="display:block; margin:0 0 5px; font-weight:bold;">Choisir un Fan Club existant :</label>
                    <select id="fc-select-existing" class="admin-form-control" style="width:100%; padding:8px; margin-bottom:10px;" required>
                        <option value="">-- Chargement des Fan Clubs... --</option>
                    </select>

                    <label style="display:block; margin:0 0 5px; font-weight:bold;">URL de la bannière dédiée :</label>
                    <input type="url" id="fc-banner-url" class="admin-form-control" placeholder="https://exemple.com/banniere.png" style="width:100%; padding:8px; margin-bottom:15px;" required>
                    
                    <button type="submit" class="btn-admin-edit">Enregistrer la bannière</button>
                </form>
            </div>
            <div class="admin-panel-inputs" style="background: #fff; padding: 20px; border-radius: 6px; border: 1px solid #f5c2c7;">
                <h3>Fan Clubs enregistrés</h3>
                <div id="fc-list-display"><em>Chargement...</em></div>
            </div>
        </div>

        <!-- 3. FORUMS (STRUCTURE) -->
        <div id="tab-forums" class="admin-tab-content" style="display: none;">
            <div class="admin-panel-inputs" style="background: #fff; padding: 20px; border-radius: 6px; border: 1px solid #f5c2c7; margin-bottom: 20px;">
                <h3>Ajouter une section Forum</h3>
                <form id="form-add-forum">
                    <input type="text" id="new-forum-title" class="admin-form-control" placeholder="Titre de la section" style="width:100%; padding:8px; margin-bottom:10px;" required>
                    <input type="text" id="new-forum-desc" class="admin-form-control" placeholder="Description du forum" style="width:100%; padding:8px; margin-bottom:10px;" required>
                    <input type="text" id="new-forum-icon" class="admin-form-control" placeholder="Emoji (ex: 🚀)" style="width:100%; padding:8px; margin-bottom:15px;" required>
                    <button type="submit" class="btn-admin-edit">Créer la section</button>
                </form>
            </div>
            <div class="admin-panel-inputs" style="background: #fff; padding: 20px; border-radius: 6px; border: 1px solid #f5c2c7;">
                <h3>Forums personnalisés existants</h3>
                <div id="custom-forums-list"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        // --- LOGIQUE DE NAVIGATION DES ONGLETS ---
        window.switchTab = function(tabName) {
            document.querySelectorAll('.admin-tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(el => el.style.background = '');
            document.getElementById('tab-' + tabName).style.display = 'block';
            document.getElementById('btn-tab-' + tabName).style.background = '#e0a899';
        };

        // --- 1. GESTION DE L'EN-TÊTE ET DE L'ACCUEIL ---
        const defaultConfig = { 
            title: "Bienvenue sur Actu Manga World : The Ultimate Otaku Network", 
            subtitle: "Toutes les sorties VF, fiches animes, concours de dessin Non-IA et espace Gaming !", 
            banner: "https://images.alphacoders.com/605/605592.png" 
        };
        const currentConfig = JSON.parse(localStorage.getItem('forumHeaderConfig')) || defaultConfig;
        
        document.getElementById('input-forum-title').value = currentConfig.title;
        document.getElementById('input-forum-subtitle').value = currentConfig.subtitle;
        document.getElementById('input-forum-banner').value = currentConfig.banner;

        document.getElementById('form-config-header').addEventListener('submit', (e) => {
            e.preventDefault();
            const newConfig = {
                title: document.getElementById('input-forum-title').value,
                subtitle: document.getElementById('input-forum-subtitle').value,
                banner: document.getElementById('input-forum-banner').value
            };
            localStorage.setItem('forumHeaderConfig', JSON.stringify(newConfig));
            alert("En-tête et accueil mis à jour avec succès !");
        });

        // --- 2. GESTION DES FAN CLUBS (AVEC SUPABASE) ---
        let fanClubsBanners = JSON.parse(localStorage.getItem('fanClubsBanners')) || [];
        let allFanClubsFromDb = [];

        async function loadFanClubsDropdown() {
            const selectEl = document.getElementById('fc-select-existing');
            try {
                // Récupère les sujets de type Fan Club depuis Supabase (ex: ceux dont la catégorie ou le type correspond)
                const { data, error } = await supabase
                    .from('topics')
                    .select('*')
                    .or('category.ilike.%fan club%,category.ilike.%fc%')
                    .order('title', { ascending: true });

                if (error) throw error;

                allFanClubsFromDb = data || [];

                if (allFanClubsFromDb.length === 0) {
                    selectEl.innerHTML = '<option value="">Aucun Fan Club trouvé dans la base de données</option>';
                    return;
                }

                selectEl.innerHTML = '<option value="">-- Sélectionnez un Fan Club --</option>' + 
                    allFanClubsFromDb.map(fc => `<option value="${fc.id}">${fc.title}</option>`).join('');

            } catch (err) {
                console.error("Erreur chargement fan clubs:", err);
                selectEl.innerHTML = '<option value="">Erreur de chargement des Fan Clubs</option>';
            }
        }

        function renderFanClubs() {
            const container = document.getElementById('fc-list-display');
            if (fanClubsBanners.length === 0) {
                container.innerHTML = "<p><em>Aucune bannière personnalisée de Fan Club enregistrée.</em></p>";
                return;
            }
            container.innerHTML = fanClubsBanners.map((fc, index) => `
                <div style="border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong>${fc.name}</strong><br>
                        <img src="${fc.banner}" alt="${fc.name}" style="height: 40px; margin-top: 5px; border-radius: 4px; display: block; object-fit: cover;">
                    </div>
                    <button type="button" onclick="window.deleteFanClub(${index})" style="background: #c0392b; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Supprimer</button>
                </div>
            `).join('');
        }

        document.getElementById('form-fanclub-banner').addEventListener('submit', (e) => {
            e.preventDefault();
            const selectEl = document.getElementById('fc-select-existing');
            const selectedId = selectEl.value;
            const selectedOption = selectEl.options[selectEl.selectedIndex];
            
            if (!selectedId) {
                alert("Veuillez sélectionner un Fan Club valide.");
                return;
            }

            const fcName = selectedOption.text;
            const bannerUrl = document.getElementById('fc-banner-url').value;

            // Vérifier si une bannière existe déjà pour ce fan club pour la mettre à jour, sinon l'ajouter
            const existingIndex = fanClubsBanners.findIndex(item => item.id === selectedId);
            if (existingIndex > -1) {
                fanClubsBanners[existingIndex].banner = bannerUrl;
                fanClubsBanners[existingIndex].name = fcName;
            } else {
                fanClubsBanners.push({
                    id: selectedId,
                    name: fcName,
                    banner: bannerUrl
                });
            }

            localStorage.setItem('fanClubsBanners', JSON.stringify(fanClubsBanners));
            document.getElementById('form-fanclub-banner').reset();
            renderFanClubs();
            loadFanClubsDropdown();
            alert("Bannière de Fan Club enregistrée avec succès !");
        });

        window.deleteFanClub = function(index) {
            if(confirm("Voulez-vous supprimer cette bannière personnalisée ?")) {
                fanClubsBanners.splice(index, 1);
                localStorage.setItem('fanClubsBanners', JSON.stringify(fanClubsBanners));
                renderFanClubs();
            }
        }

        loadFanClubsDropdown();
        renderFanClubs();

        // --- 3. GESTION DES FORUMS & SECTIONS ---
        let customForums = JSON.parse(localStorage.getItem('customForumsList')) || [];

        function renderCustomForums() {
            const container = document.getElementById('custom-forums-list');
            if (customForums.length === 0) {
                container.innerHTML = "<p><em>Aucun forum personnalisé pour l'instant.</em></p>";
                return;
            }
            container.innerHTML = customForums.map((f, index) => `
                <div style="border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong>${f.icon} ${f.title}</strong><br>
                        <small style="color: #666;">${f.desc}</small>
                    </div>
                    <button type="button" onclick="window.deleteCustomForum(${index})" style="background: #c0392b; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Supprimer</button>
                </div>
            `).join('');
        }

        document.getElementById('form-add-forum').addEventListener('submit', (e) => {
            e.preventDefault();
            const newForum = {
                title: document.getElementById('new-forum-title').value,
                desc: document.getElementById('new-forum-desc').value,
                icon: document.getElementById('new-forum-icon').value
            };
            customForums.push(newForum);
            localStorage.setItem('customForumsList', JSON.stringify(customForums));
            document.getElementById('form-add-forum').reset();
            renderCustomForums();
            alert("Section de forum ajoutée avec succès !");
        });

        window.deleteCustomForum = function(index) {
            if(confirm("Voulez-vous vraiment supprimer ce forum ?")) {
                customForums.splice(index, 1);
                localStorage.setItem('customForumsList', JSON.stringify(customForums));
                renderCustomForums();
            }
        }
        renderCustomForums();
    </script>
</body>
</html>
