<!-- Table mise à jour avec Date de Fin -->
<table class="forum-table">
    <thead>
        <tr>
            <th>Nom de la Convention</th>
            <th>Début</th>
            <th>Fin</th>
            <th>Lieu</th>
        </tr>
    </thead>
    <tbody id="conventions-body">
        <!-- Les données arriveront ici -->
    </tbody>
</table>

<script type="module">
    import { supabase } from './supabase.js';

    async function loadConventions() {
        const { data, error } = await supabase
            .from('conventions')
            .select('*')
            .order('date', { ascending: false }); // <-- Changé de true à false pour inverser l'ordre

        const tbody = document.getElementById('conventions-body');
        
        if (error || !data.length) {
            tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>Aucune convention programmée pour le moment.</td></tr>";
            return;
        }

        tbody.innerHTML = data.map(conv => `
            <tr>
                <td style="font-weight:bold; color:#3498db;">${conv.name}</td>
                <td>${new Date(conv.date).toLocaleDateString('fr-FR')}</td>
                <td>${conv.end_date ? new Date(conv.end_date).toLocaleDateString('fr-FR') : '-'}</td>
                <td>${conv.location}</td>
            </tr>
        `).join('');
    }
    loadConventions();
</script>
