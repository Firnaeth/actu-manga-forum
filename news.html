<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualités & Conventions - Forum Actu Manga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="wrapper">
        <div class="breadcrumb">
            <a href="index.html">Index du Forum</a> &raquo; <span>Actualités & Sorties</span>
        </div>

        <div style="font-size: 16px; font-weight: bold; color: #c2185b; margin-bottom: 15px; border-bottom: 2px solid #f8bbd0; padding-bottom: 5px;">
            📅 Calendrier des Conventions & Salons
        </div>

        <!-- C'est ici que les tableaux par année vont s'injecter -->
        <div id="conventions-container">
            <div style="text-align: center; color: #7f8c8d; padding: 20px;">Chargement des conventions...</div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        async function loadConventions() {
            try {
                const { data, error } = await supabase
                    .from('conventions')
                    .select('*')
                    .order('date', { ascending: false });

                const container = document.getElementById('conventions-container');
                
                if (error) {
                    console.error("Erreur Supabase:", error);
                    container.innerHTML = "<p style='text-align: center; color: red;'>Erreur lors du chargement des données.</p>";
                    return;
                }

                if (!data || data.length === 0) {
                    container.innerHTML = "<p style='text-align: center; color: #7f8c8d;'>Aucune convention programmée pour le moment.</p>";
                    return;
                }

                // Regroupement par année
                const grouped = {};
                data.forEach(conv => {
                    const year = new Date(conv.date).getFullYear();
                    if (!grouped[year]) grouped[year] = [];
                    grouped[year].push(conv);
                });

                // Tri des années du futur vers le passé (2027 puis 2026)
                const sortedYears = Object.keys(grouped).sort((a, b) => b - a);

                let htmlContent = '';

                sortedYears.forEach(year => {
                    htmlContent += `
                        <div style="margin-top: 25px; margin-bottom: 10px; font-weight: bold; font-size: 16px; color: #c2185b; border-bottom: 2px solid #c2185b; padding-bottom: 5px;">
                            📅 Conventions ${year}
                        </div>
                        <table class="forum-table" style="margin-bottom: 20px;">
                            <thead>
                                <tr>
                                    <th>Nom de la Convention</th>
                                    <th style="width: 120px; text-align: center;">Début</th>
                                    <th style="width: 120px; text-align: center;">Fin</th>
                                    <th style="width: 250px;">Lieu</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    grouped[year].forEach(conv => {
                        htmlContent += `
                            <tr>
                                <td style="font-weight: bold;">${conv.name}</td>
                                <td style="text-align: center; font-size: 12px;">${new Date(conv.date).toLocaleDateString('fr-FR')}</td>
                                <td style="text-align: center; font-size: 12px;">${conv.end_date ? new Date(conv.end_date).toLocaleDateString('fr-FR') : '-'}</td>
                                <td style="font-size: 12px; color: #555;">${conv.location || 'Lieu non spécifié'}</td>
                            </tr>
                        `;
                    });

                    htmlContent += `</tbody></table>`;
                });

                container.innerHTML = htmlContent;

            } catch (err) {
                console.error("Erreur critique:", err);
            }
        }

        loadConventions();
    </script>
</body>
</html>
