<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Concours de Dessin - Actu Manga World</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .art-card { border: 1px solid #ccc; padding: 10px; text-align: center; background: #f9f9f9; }
        .art-card img { max-width: 100%; height: auto; border: 1px solid #ddd; }
        .upload-section { margin-top: 40px; padding: 20px; border-top: 2px solid #333; }
    </style>
</head>
<body>

    <div id="wrapper">
        <h1>🎨 Concours de Dessin : Thème du mois</h1>

        <!-- Galerie des participants -->
        <div id="contest-gallery" class="contest-grid">
            <p>Chargement des dessins...</p>
        </div>

        <!-- Formulaire d'upload (Masqué si non connecté) -->
        <div id="upload-form-container" class="upload-section hidden">
            <h3>Participer au concours</h3>
            <form id="form-add-contest">
                <input type="text" id="input-art-title" placeholder="Titre de votre œuvre" required>
                <input type="file" id="input-art-file" accept="image/*" required>
                <button type="submit" class="btn-admin-edit">Envoyer ma participation</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        const gallery = document.getElementById('contest-gallery');
        const uploadContainer = document.getElementById('upload-form-container');
        const username = localStorage.getItem('forumUsername');

        // 1. Afficher le formulaire si connecté
        if (username) uploadContainer.classList.remove('hidden');

        // 2. Charger les dessins depuis la base
        async function loadGallery() {
            const { data, error } = await supabase.from('contest_entries').select('*');
            if (error) { gallery.innerHTML = "Erreur de chargement."; return; }
            
            if (data.length === 0) { gallery.innerHTML = "Aucun dessin pour le moment."; return; }

            gallery.innerHTML = data.map(art => `
                <div class="art-card">
                    <img src="${art.image_url}" alt="${art.title}">
                    <p><strong>${art.title}</strong><br><small>par ${art.author}</small></p>
                </div>
            `).join('');
        }

        // 3. Gérer l'upload du dessin
        document.getElementById('form-add-contest').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('input-art-file').files[0];
            const title = document.getElementById('input-art-title').value;

            // Envoi dans le Storage
            const fileName = `${Date.now()}_${file.name}`;
            const { data: uploadData, error: uploadError } = await supabase.storage
                .from('concours') // Ton Bucket Supabase
                .upload(fileName, file);

            if (uploadError) { alert("Erreur d'upload : " + uploadError.message); return; }

            // Récupérer l'URL publique
            const { data: urlData } = supabase.storage.from('concours').getPublicUrl(fileName);

            // Sauvegarde dans la table SQL
            await supabase.from('contest_entries').insert([{ 
                title: title, 
                image_url: urlData.publicUrl, 
                author: username 
            }]);

            alert("Dessin publié !");
            window.location.reload();
        });

        loadGallery();
    </script>
</body>
</html>
