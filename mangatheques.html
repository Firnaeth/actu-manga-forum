<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mangathèques & Profils MyAnimeList - Actu Manga World</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="wrapper">

        <!-- EN-TÊTE ET NAVIGATION -->
        <div class="main-header">
            <img id="forum-banner-img" src="https://images.alphacoders.com/605/605592.png" alt="Bannière Forum Manga" class="header-banner">
        </div>

        <nav class="forum-nav">
            <a href="index.html" class="nav-link">Index</a>
            <a href="community.html" class="nav-link">Fiches & Critiques</a>
            <a href="contest-view.html" class="nav-link">Concours Dessin</a>
            <a href="mangatheques.html" class="nav-link highlight">Mangathèques</a>
            <a href="profile.html" id="nav-profile-link" class="nav-link hidden">Mon Profil</a>
            <a href="register.html" id="nav-auth-link" class="nav-link">S'enregistrer</a>
        </nav>

        <!-- CONTENU PRINCIPAL SOUS FORME DE TABLEAU FORUM -->
        <table class="forum-table" style="margin-top: 15px;">
            <thead>
                <tr>
                    <th colspan="2" class="cat-title">_ Galerie des Mangathèques & MyAnimeList _</th>
                    <th class="stat-head">Rang</th>
                    <th class="last-post-head">MyAnimeList</th>
                </tr>
            </thead>
            <tbody id="mangatheques-tbody">
                <tr>
                    <td colspan="4" style="text-align: center; padding: 20px;"><em>Chargement des mangathèques...</em></td>
                </tr>
            </tbody>
        </table>

    </div>

    <!-- SCRIPT DE CHARGEMENT SUPABASE -->
    <script type="module">
        import { supabase } from './supabase.js';

        // Gestion de l'affichage connexion / déconnexion dans la nav
        const currentUsername = localStorage.getItem('forumUsername');
        const profileLink = document.getElementById('nav-profile-link');
        const authLink = document.getElementById('nav-auth-link');
        
        if (currentUsername) {
            profileLink.classList.remove('hidden');
            authLink.textContent = "Déconnexion";
            authLink.setAttribute('href', '#');
            authLink.onclick = async (e) => {
                e.preventDefault();
                try { await supabase.auth.signOut(); } catch (err) {}
                localStorage.clear();
                window.location.href = 'index.html';
            };
        }

        // Chargement des profils depuis Supabase
        async function loadMangatheques() {
            const tbodyEl = document.getElementById('mangatheques-tbody');
            const defaultAvatar = "https://i.pinimg.com/236x/d9/1b/2e/d91b2e2b34a6210f22ef2f8bb7df5f06.jpg";

            const { data: profiles, error } = await supabase
                .from('profiles')
                .select('username, rank, avatar_url, mal_url');

            if (error) {
                tbodyEl.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red; padding: 20px;">Erreur lors du chargement des données.</td></tr>`;
                return;
            }

            // Filtrer pour ne garder que les membres qui ont un lien MAL renseigné
            const filteredProfiles = profiles ? profiles.filter(user => user.mal_url && user.mal_url.trim() !== "") : [];

            if (filteredProfiles.length === 0) {
                tbodyEl.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 20px;">Aucun membre n'a encore partagé son profil MyAnimeList.</td></tr>`;
                return;
            }

            tbodyEl.innerHTML = filteredProfiles.map(user => {
                const avatar = (user.avatar_url && user.avatar_url.trim() !== "") ? user.avatar_url : defaultAvatar;
                const userRank = user.rank ? user.rank : '<span style="color: #7f8c8d;">Membre</span>';

                return `
                    <tr>
                        <td class="icon-cell" style="width: 60px; text-align: center;">
                            <img src="${avatar}" alt="${user.username}" style="width: 40px; height: 40px; border-radius: 4px; object-fit: cover; border: 1px solid #ccc;">
                        </td>
                        <td class="forum-desc">
                            <a href="profile.html?user=${encodeURIComponent(user.username)}" class="forum-title">${user.username}</a>
                            <p>Espace de partage de collection et statistiques.</p>
                        </td>
                        <td class="stat-cell" style="text-align: center; font-weight: bold; color: #c0392b;">${userRank}</td>
                        <td class="last-post-cell" style="text-align: center;">
                            <a href="${user.mal_url}" target="_blank" style="color: #2e51a2; font-weight: bold; text-decoration: underline;">Voir le profil MAL</a>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        loadMangatheques();
    </script>
</body>
</html>
