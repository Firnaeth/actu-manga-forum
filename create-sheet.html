<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer une Fiche - Forum Actu Manga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="wrapper">
        <div class="breadcrumb">
            <a href="index.html">Index du Forum</a> &raquo; <a href="community.html">Espace Communauté</a> &raquo; <span>Créer une Fiche</span>
        </div>

        <div class="form-box">
            <div class="box-title">Créer une nouvelle Fiche (Manga / Anime / Jeu Vidéo)</div>
            <form class="retro-form" id="create-sheet-form">
                <div class="form-group">
                    <label for="type">Type de Fiche :</label>
                    <select id="type" required>
                        <option value="manga">📖 Manga</option>
                        <option value="anime">📺 Anime</option>
                        <option value="game">🎮 Jeu Vidéo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="title">Titre de l'œuvre :</label>
                    <input type="text" id="title" placeholder="Ex: Chainsaw Man" required>
                </div>

                <div class="form-group">
                    <label for="cover">URL de l'affiche / Jaquette :</label>
                    <input type="url" id="cover" placeholder="https://lien-de-l-image.jpg">
                </div>

                <div class="form-group">
                    <label for="details">Auteur / Studio / Développeur :</label>
                    <input type="text" id="details" placeholder="Ex: Tatsuki Fujimoto / FromSoftware">
                </div>

                <div class="form-group">
                    <label for="age-rating">Tranche d'âge conseillée :</label>
                    <select id="age-rating" required>
                        <option value="0 ans et +">👶 0 ans et + (Tous publics)</option>
                        <option value="10 ans et +">👦 10 ans et +</option>
                        <option value="12 ans et +">🧑 12 ans et +</option>
                        <option value="16 ans et +">🔞 16 ans et + (Avertissement)</option>
                        <option value="18 ans et +">🔥 18 ans et + (Public averti)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="rating">Ta Note :</label>
                    <select id="rating">
                        <option value="5">⭐⭐⭐⭐⭐ (5/5 - Chef-d'œuvre)</option>
                        <option value="4">⭐⭐⭐⭐☆ (4/5 - Excellent)</option>
                        <option value="3">⭐⭐⭐☆☆ (3/5 - Bon)</option>
                        <option value="2">⭐⭐☆☆☆ (2/5 - Moyen)</option>
                        <option value="1">⭐☆☆☆☆ (1/5 - À éviter)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="synopsis">Synopsis / Résumé :</label>
                    <textarea id="synopsis" rows="4" placeholder="Résumé de l'œuvre..."></textarea>
                </div>

                <div class="form-group">
                    <label for="review">Ton avis personnel :</label>
                    <textarea id="review" rows="6" placeholder="Ce que tu as pensé des graphismes, du scénario, etc."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Publier la Fiche</button>
                    <a href="community.html" class="btn-reply" style="background: #e74c3c; text-decoration: none; text-align: center; margin-left: 10px; display: inline-block; padding: 6px 12px; color: white;">Annuler</a>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        const currentUsername = localStorage.getItem('forumUsername');

        document.getElementById('create-sheet-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!currentUsername) {
                alert("Vous devez être connecté pour publier une fiche !");
                window.location.href = "register.html";
                return;
            }

            const sheetType = document.getElementById('type').value;
            const title = document.getElementById('title').value;
            const cover = document.getElementById('cover').value;
            const details = document.getElementById('details').value;
            const ageRating = document.getElementById('age-rating').value;
            const rating = document.getElementById('rating').value;
            const synopsis = document.getElementById('synopsis').value;
            const review = document.getElementById('review').value;

            // On combine les informations dans le contenu (content) ou les colonnes adaptées de Supabase
            const fullContent = `[${details}] ${synopsis} \n\nAvis : ${review}`;

            const { error } = await supabase.from('topics').insert([
                { 
                    title: title, 
                    content: fullContent, 
                    category: 'community', 
                    sheet_type: sheetType, 
                    author: currentUsername,
                    replies_count: 0 
                }
            ]);

            if (error) {
                alert("Erreur lors de la publication : " + error.message);
            } else {
                alert('Fiche publiée avec succès sur le forum !');
                window.location.href = 'community.html';
            }
        });
    </script>
</body>
</html>
