<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture de Sujet - Le QG des Discussions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wrapper">
        <div style="background: #2c3e50; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9em; margin-bottom: 15px;">
            <span id="user-status-bar">Connexion en cours...</span>
            <div>
                <button onclick="setAdminMode(true)" style="background: #ecf0f1; color: #2c3e50; border: none; padding: 4px 8px; font-weight: bold; cursor: pointer; border-radius: 3px; margin-right: 5px;">Mode Admin</button>
                <button onclick="setAdminMode(false)" style="background: #bdc3c7; color: #2c3e50; border: none; padding: 4px 8px; font-weight: bold; cursor: pointer; border-radius: 3px;">Mode Membre</button>
            </div>
        </div>

        <div class="breadcrumb" style="margin: 10px 0; font-size: 0.9em; background: #f9f9f9; padding: 8px 12px; border: 1px solid #ddd;">
            <a href="index.html">Index du Forum</a> &raquo; <a href="general.html">Le QG des Discussions</a> &raquo; <span id="breadcrumb-title">Chargement...</span>
        </div>

        <h2 id="topic-title-header" style="color: #333; font-size: 1.3em; margin: 15px 0; border-bottom: 2px solid #f2d9de; padding-bottom: 8px;">Chargement du sujet...</h2>

        <div style="margin: 15px 0; display: flex; gap: 10px;">
            <a href="general.html" style="background: linear-gradient(to bottom, #7ac1eb, #4196d2); color: white; padding: 6px 14px; text-decoration: none; font-size: 0.9em; font-weight: bold; border-radius: 3px; display: inline-block; border: 1px solid #327cb5;">+ Créer un Sujet</a>
            <a href="#reply-section" style="background: linear-gradient(to bottom, #ff99bb, #ff6699); color: white; padding: 6px 14px; text-decoration: none; font-size: 0.9em; font-weight: bold; border-radius: 3px; display: inline-block; border: 1px solid #e65c8a;">Répondre à ce sujet</a>
        </div>

        <div id="topic-main-post" style="display: flex; border: 1px solid #f2d9de; background: white; margin-bottom: 20px;">
            <div style="width: 180px; background: #fff5f7; border-right: 1px solid #f2d9de; padding: 15px; text-align: center;">
                <strong id="author-name" style="color: #004080; font-size: 0.95em;">Chargement...</strong>
                <div style="font-size: 0.8em; color: #666; margin-top: 2px;">Fondateur</div>
            </div>
            <div style="flex-grow: 1; padding: 15px; position: relative;">
                <div id="topic-actions" style="position: absolute; top: 10px; right: 15px;" class="hidden">
                    <button onclick="editTopic()" style="background: #f39c12; color: white; border: none; padding: 3px 8px; font-size: 0.8em; border-radius: 3px; cursor: pointer;">Éditer</button>
                    <button onclick="deleteTopic()" style="background: #e74c3c; color: white; border: none; padding: 3px 8px; font-size: 0.8em; border-radius: 3px; cursor: pointer;">Supprimer</button>
                </div>
                <div style="font-size: 0.8em; color: #888; border-bottom: 1px dashed #eee; padding-bottom: 5px; margin-bottom: 10px;">Posté le <span id="topic-date">--</span></div>
                <div id="topic-content-body" style="font-size: 0.95em; line-height: 1.5; white-space: pre-wrap;">Chargement...</div>
            </div>
        </div>

        <div id="replies-container"></div>

        <div id="reply-section" style="border: 1px solid #61b3e8; background: white; margin-bottom: 30px; border-radius: 4px; overflow: hidden;">
            <div style="background: linear-gradient(to bottom, #7ac1eb, #4196d2); color: white; padding: 8px 15px; font-weight: bold;">Poster une réponse</div>
            <div style="padding: 15px;">
                <textarea id="reply-content" rows="6" style="width: 100%; border: 1px solid #ccc; padding: 8px; resize: vertical;"></textarea>
                <button id="submit-reply" style="margin-top:10px; background: #4196d2; color: white; border: none; padding: 8px 15px; cursor: pointer;">Envoyer</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';
        let currentUsername = localStorage.getItem('forumUsername') || 'Invité';
        let isAdminMode = localStorage.getItem('forumAdminMode') === 'true';

        function updateStatusBar() {
            document.getElementById('user-status-bar').textContent = `Connecté en tant que : ${currentUsername} ${isAdminMode ? '(Admin)' : '(Membre)'}`;
        }
        
        window.setAdminMode = (status) => {
            isAdminMode = status;
            localStorage.setItem('forumAdminMode', status);
            updateStatusBar();
            location.reload();
        }
        
        updateStatusBar();
        const topicId = new URLSearchParams(window.location.search).get('id');

        async function loadTopicAndReplies() {
            const { data: topic } = await supabase.from('general_topics').select('*').eq('id', topicId).single();
            if (!topic) return;
            document.getElementById('breadcrumb-title').textContent = topic.title;
            document.getElementById('topic-title-header').textContent = topic.title;
            document.getElementById('author-name').textContent = topic.author;
            document.getElementById('topic-date').textContent = new Date(topic.created_at).toLocaleDateString();
            document.getElementById('topic-content-body').textContent = topic.content;
            
            if (isAdminMode || currentUsername === topic.author) document.getElementById('topic-actions').classList.remove('hidden');
            
            const { data: replies } = await supabase.from('topic_replies').select('*').eq('topic_id', topicId).eq('category', 'general').order('created_at');
            document.getElementById('replies-container').innerHTML = replies.map(r => `<div>${r.author}: ${r.content}</div>`).join('');
        }

        document.getElementById('submit-reply').onclick = async () => {
            const content = document.getElementById('reply-content').value;
            await supabase.from('topic_replies').insert([{ topic_id: topicId, category: 'general', content, author: currentUsername }]);
            location.reload();
        };

        loadTopicAndReplies();
    </script>
</body>
</html>
