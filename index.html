<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Forum Actu Manga - Modern Retro 2010</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="wrapper">
        <div id="admin-bar-container" class="admin-edit-bar hidden">
            <span class="admin-title-badge">⚙️ Administration de l'en-tête</span>
            <button class="btn-admin-edit" id="btn-toggle-admin">Modifier Titre & Bannière</button>
        </div>

        <div id="admin-panel-form" class="admin-panel-inputs hidden">
            <form id="form-config-header">
                <label>Titre principal du forum :</label>
                <input type="text" id="input-forum-title" required>
                
                <label>Description / Sous-titre :</label>
                <input type="text" id="input-forum-subtitle" required>

                <label>Lien (URL) de l'image de bannière :</label>
                <input type="url" id="input-forum-banner" required>

                <div class="admin-form-actions">
                    <button type="submit" class="btn-admin-edit">Enregistrer</button>
                    <button type="button" class="btn-admin-edit btn-cancel" id="btn-cancel-admin">Annuler</button>
                </div>
            </form>
        </div>

        <div class="main-header">
            <img id="forum-banner-img" src="https://images.alphacoders.com/605/605592.png" alt="Bannière Forum Manga" class="header-banner">
        </div>

        <nav class="forum-nav">
            <a href="index.html" class="nav-link">Index</a>
            <a href="community.html" class="nav-link">Fiches & Critiques</a>
            <a href="contest-view.html" class="nav-link">Concours Dessin</a>
            <a href="#" class="nav-link">Rechercher</a>
            <a href="profile.html" id="nav-profile-link" class="nav-link hidden">Mon Profil & Mangathèque</a>
            <a href="register.html" id="nav-auth-link" class="nav-link highlight">S'enregistrer</a>
            <a href="#" class="nav-link">FAQ</a>
        </nav>

        <div class="news-container">
            <div class="welcome-banner">
                <h2 id="forum-title-display">Bienvenue sur Actu Manga World</h2>
                <p id="forum-subtitle-display">Toutes les sorties VF, fiches animes, concours de dessin Non-IA et espace Gaming !</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        const currentUsername = localStorage.getItem('forumUsername');
        const currentUserRole = localStorage.getItem('forumUserRole');

        const profileLink = document.getElementById('nav-profile-link');
        const authLink = document.getElementById('nav-auth-link');

        if (currentUsername) {
            profileLink.classList.remove('hidden');
            profileLink.href = `profile.html?user=${encodeURIComponent(currentUsername)}`;
            
            authLink.textContent = "Déconnexion";
            authLink.href = "#";
            authLink.onclick = async function() {
                await supabase.auth.signOut();
                localStorage.removeItem('forumUsername');
                localStorage.removeItem('forumUserRole');
                alert("Vous êtes déconnecté !");
                window.location.reload();
            };
        } else {
            profileLink.classList.add('hidden');
        }

        const adminBar = document.getElementById('admin-bar-container');
        if (currentUsername && currentUserRole === "admin") {
            adminBar.classList.remove('hidden');
        }

        document.getElementById('btn-toggle-admin')?.addEventListener('click', toggleAdminPanel);
        document.getElementById('btn-cancel-admin')?.addEventListener('click', toggleAdminPanel);

        function toggleAdminPanel() {
            document.getElementById('admin-panel-form').classList.toggle('hidden');
        }
    </script>
</body>
</html>
