<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Club - Actu Manga World</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .fc-tabs-wrapper { display: flex; align-items: center; justify-content: space-between; margin: 20px 0; border-bottom: 2px solid #f8d7da; padding-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .fc-tabs { display: flex; gap: 10px; flex-wrap: wrap; }
        .tab-link { padding: 8px 15px; background: #fff0f3; color: #d63384; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .tab-link.active { background: #d63384; color: white; }
        .btn-add-tab { background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85em; }
        .btn-add-tab:hover { background: #218838; }
        .btn-edit-desc { background: transparent; border: none; color: #d63384; cursor: pointer; font-size: 0.85em; margin-left: 5px; text-decoration: underline; }
    </style>
</head>
<body>

<div id="wrapper">
    <!-- EN-TÊTE ET BANNIÈRE DYNAMIQUE -->
    <div class="main-header">
        <img id="forum-banner-img" src="https://images.alphacoders.com/605/605592.png" alt="Bannière du Fan Club" class="header-banner">
    </div>

    <!-- FIL D'ARIANE -->
    <div class="breadcrumb" style="margin: 10px 0; font-size: 0.9em;">
        <a href="index.html">Accueil</a> &raquo; <a href="forum_fc.html">Fan Clubs</a> &raquo; <span id="breadcrumb-fc-name">Chargement...</span>
    </div>

    <!-- BANNIÈRE DE PRÉSENTATION DU FAN CLUB -->
    <div class="welcome-banner" style="text-align: center; padding: 15px;">
        <h2 id="fc-main-title">⭐ Chargement du Fan Club...</h2>
        <p style="margin-top: 8px; color: #555;" id="fc-main-desc">Chargement de la description...</p>
        <p style="font-size: 0.85em; color: #888; margin-top: 5px;">
            <span id="fc-author-info">Créé par Inconnu</span> - Espace officiel. 
            <button id="btn-edit-description" class="btn-edit-desc" style="display: none;">Modifier la description</button>
        </p>
    </div>

    <!-- SOUS-MENUS ET BOUTON D'ADMINISTRATION DES ONGLETS -->
    <div class="fc-tabs-wrapper">
        <div class="fc-tabs" id="fc-tabs-container">
            <!-- Les onglets dynamiques s'afficheront ici -->
        </div>
        <button id="btn-open-add-tab" class="btn-add-tab" style="display: none;">+ Ajouter un onglet</button>
    </div>

    <table class="forum-table">
        <thead>
            <tr>
                <th class="cat-title">_ Sujets de cette section _</th>
                <th class="stat-head" style="text-align: center;">Auteur</th>
            </tr>
        </thead>
        <tbody id="fc-topics-container">
            <tr><td colspan="2" style="text-align: center; padding: 20px;"><em>Chargement des sujets...</em></td></tr>
        </tbody>
    </table>

    <!-- BOUTON CRÉER UN SUJET -->
    <div style="margin-top: 15px; margin-bottom: 20px;">
        <a href="#" id="btn-create-fc-topic" class="btn-admin-edit" style="text-decoration: none; padding: 6px 12px; background: #61b3e8; color: white; border-radius: 4px; font-weight: bold; font-size: 0.9em;">+ Créer un Sujet dans cette section</a>
    </div>
</div>

<script type="module">
    import { supabase } from './supabase.js';

    const urlParams = new URLSearchParams(window.location.search);
    const fcId = urlParams.get('id'); // ID numérique du Fan Club

    function getDefaultTabsForFanClub(title) {
        if (!title) return getDefaultTabs();
        const upperTitle = title.toUpperCase();

        if (upperTitle.includes('VANDREAD')) {
            return [
                { id: 'dita', label: 'Fans de Dita' },
                { id: 'hibiki', label: 'Fans de Hibiki' },
                { id: 'precurseur', label: 'Le Précurseur' }
            ];
        } else if (upperTitle.includes('BLEACH')) {
            return [
                { id: 'ichigo', label: 'Fans d\'Ichigo' },
                { id: 'capitaines', label: 'Les Capitaines Gotei 13' },
                { id: 'zanpakuto', label: 'Théories Zanpakutô' }
            ];
        } else if (upperTitle.includes('INUYASHA')) {
            return [
                { id: 'inuyasha_kagome', label: 'Inuyasha & Kagome' },
                { id: 'sesshomaru', label: 'Fans de Sesshômaru' },
                { id: 'shikon', label: 'La Perle de Shikon' }
            ];
        } else {
            return getDefaultTabs();
        }
    }

    function getDefaultTabs() {
        return [
            { id: 'general', label: 'Discussion Générale' },
            { id: 'theories', label: 'Théories & Avis' },
            { id: 'galerie', label: 'Galerie & Fanarts' }
        ];
    }

    async function initFanClubPage() {
        if (!fcId) {
            document.getElementById('fc-main-title').textContent = "Fan Club introuvable";
            return;
        }

        // 1. Récupérer les infos du Fan Club depuis Supabase
        const { data: fc, error } = await supabase
            .from('topics')
            .select('*')
            .eq('id', fcId)
            .single();

        if (error || !fc) {
            document.getElementById('fc-main-title').textContent = "Fan Club introuvable";
            document.getElementById('breadcrumb-fc-name').textContent = "Erreur";
            return;
        }

        // Afficher la bannière spécifique du Fan Club si elle existe dans la base de données (ex: fc.image ou fc.banner)
        const bannerImgElem = document.getElementById('forum-banner-img');
        const fanClubBanner = fc.image || fc.banner; // Adapte selon le nom de la colonne dans ta table 'topics'
        if (fanClubBanner) {
            bannerImgElem.src = fanClubBanner;
        }

        // Afficher les infos principales du Fan Club
        document.getElementById('fc-main-title').textContent = `⭐ ${fc.title}`;
        document.getElementById('breadcrumb-fc-name').textContent = fc.title;
        document.getElementById('fc-author-info').textContent = `Créé par ${fc.author || 'Inconnu'}`;

        // Gestion de la description personnalisée
        const descElem = document.getElementById('fc-main-desc');
        const editDescBtn = document.getElementById('btn-edit-description');
        
        let customDesc = localStorage.getItem(`fc_desc_${fcId}`) || fc.content || "Bienvenue dans l'espace de discussion et sous-sections thématiques de ce Fan Club.";
        descElem.textContent = customDesc;
        editDescBtn.style.display = 'inline-block';

        editDescBtn.onclick = () => {
            const newDesc = prompt("Modifier la description du Fan Club :", descElem.textContent);
            if (newDesc !== null) {
                localStorage.setItem(`fc_desc_${fcId}`, newDesc);
                descElem.textContent = newDesc;
            }
        };

        // Afficher le bouton d'ajout d'onglet
        document.getElementById('btn-open-add-tab').style.display = 'inline-block';

        // 2. Charger les onglets
        let tabs = getStoredTabs(fcId, fc.title);
        renderTabs(tabs);

        // 3. Action du bouton d'ajout d'onglet à la volée
        document.getElementById('btn-open-add-tab').onclick = () => {
            const labelNom = prompt("Entrez le nom du nouvel onglet (ex: Les Classes de Quincy) :");
            if (!labelNom) return;

            const tabId = labelNom.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '_');

            if (tabs.some(t => t.id === tabId)) {
                alert("Cet onglet existe déjà !");
                return;
            }

            tabs.push({ id: tabId, label: labelNom });
            saveStoredTabs(fcId, tabs);
            renderTabs(tabs);
            alert(`L'onglet "${labelNom}" a été ajouté avec succès !`);
        };
    }

    function getStoredTabs(fcId, title) {
        const saved = localStorage.getItem(`fc_tabs_${fcId}`);
        if (saved) {
            try { return JSON.parse(saved); } catch(e) {}
        }
        return getDefaultTabsForFanClub(title);
    }

    function saveStoredTabs(fcId, tabs) {
        localStorage.setItem(`fc_tabs_${fcId}`, JSON.stringify(tabs));
    }

    function renderTabs(tabs) {
        const tabsContainer = document.getElementById('fc-tabs-container');
        tabsContainer.innerHTML = tabs.map((tab, index) => `
            <a href="#" class="tab-link ${index === 0 ? 'active' : ''}" data-tab="${tab.id}">${tab.label}</a>
        `).join('');

        if (tabs.length > 0) {
            loadTopics(tabs[0].id);
        }

        document.querySelectorAll('.tab-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                loadTopics(link.getAttribute('data-tab'));
            });
        });
    }

    async function loadTopics(tab) {
        const container = document.getElementById('fc-topics-container');
        container.innerHTML = '<tr><td colspan="2" style="text-align: center; padding: 20px;"><em>Chargement...</em></td></tr>';

        const categoryKey = `fc_${fcId}_${tab}`;
        document.getElementById('btn-create-fc-topic').setAttribute('href', `new-topic.html?cat=${categoryKey}`);

        const { data: topics, error } = await supabase
            .from('topics')
            .select('*')
            .eq('category', categoryKey)
            .order('created_at', { ascending: false });

        if (error || !topics || topics.length === 0) {
            container.innerHTML = `<tr><td colspan="2" style="text-align: center; padding: 20px;">Aucun sujet dans cette section. <a href="new-topic.html?cat=${categoryKey}" style="color: #61b3e8; font-weight: bold;">Créez-en un !</a></td></tr>`;
            return;
        }

        container.innerHTML = topics.map(t => {
            const dateFormatted = new Date(t.created_at).toLocaleDateString([], {day: '2-digit', month: '2-digit', year: 'numeric'});
            return `
                <tr>
                    <td class="forum-desc">
                        <a href="topic.html?id=${t.id}" class="forum-title" style="font-weight: bold; font-size: 1.05em;">${t.title}</a>
                        <p style="font-size: 0.8em; color: #666; margin-top: 2px;">Créé le ${dateFormatted}</p>
                    </td>
                    <td class="stat-cell" style="text-align: center;">${t.author || 'Inconnu'}</td>
                </tr>
            `;
        }).join('');
    }

    initFanClubPage();
</script>
</body>
</html>
