<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer un Nouveau Sujet</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Styles de la barre d'outils unifiée */
        .editor-toolbar {
            background: #f1f1f1;
            padding: 6px;
            border: 1px solid #ccc;
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
            border-radius: 4px 4px 0 0;
            margin-top: 10px;
        }
        .editor-toolbar button, .editor-toolbar select {
            padding: 4px 8px;
            cursor: pointer;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 0.9em;
        }
        .editor-toolbar button:hover, .editor-toolbar select:hover {
            background: #e2e2e2;
        }
        .editor-textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 4px 4px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <h1 class="topic-main-title">📝 Création d'un Nouveau Sujet</h1>
        <form class="reply-form" id="new-topic-form">
            <label for="topic-type">Catégorie :</label>
            <select id="topic-type" style="width: 100%; padding: 8px; margin-bottom: 12px;">
                <option value="planning">📅 Planning des Sorties VF</option>
                <option value="licences">🚧 Annonces</option>
                <option value="conventions">🎟️ Planning des Conventions & Projets</option>
                <option value="manga">📄 Fiches & Critiques (Mangas & Animes)</option>
                <option value="graphisme">🎨 Atelier Graphique & Signatures</option>
                <option value="fc">⭐ Fan Clubs Officiels</option>
                <option value="gaming">🕹️ Coin Arcade & Jeux Vidéo</option>
                <option value="general">☕ Le QG des Discussions</option>
            </select>

            <label for="topic-title-input">Titre :</label>
            <input type="text" id="topic-title-input" style="width: 100%; padding: 8px; margin-bottom: 12px;" required>

            <label for="topic-content">Contenu :</label>
            
            <!-- BARRE D'OUTILS GÉNÉRÉE DYNAMIQUEMENT -->
            <div id="toolbar-topic-content"></div>

            <textarea id="topic-content" rows="10" class="editor-textarea" placeholder="Écrivez votre contenu ici. Pour partager une bannière ou une création, collez simplement le lien direct de votre image (http://...)" required></textarea>

            <button type="submit" class="btn-submit" style="margin-top: 15px;">Publier le sujet</button>
        </form>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        // --- FONCTION QUI GÉNÈRE LA BARRE D'OUTILS ---
        window.createEditorToolbar = function(textareaId) {
            return `
                <div class="editor-toolbar">
                    <button type="button" onclick="insertTag('${textareaId}', '**', '**')" style="font-weight: bold;" title="Gras">B</button>
                    <button type="button" onclick="insertTag('${textareaId}', '*', '*')" style="font-style: italic;" title="Italique">I</button>
                    <button type="button" onclick="insertTag('${textareaId}', '<u>', '</u>')" style="text-decoration: underline;" title="Souligné">U</button>
                    <button type="button" onclick="insertTag('${textareaId}', '<p>', '</p>')" title="Paragraphe">Paragraphe</button>
                    
                    <span style="border-left: 1px solid #ccc; height: 20px; margin: 0 4px;"></span>
                    
                    <button type="button" onclick="insertImage('${textareaId}')" title="Insérer une image">🖼️ Image</button>
                    <button type="button" onclick="insertVideo('${textareaId}')" title="Insérer une vidéo">🎬 Vidéo</button>
                    <button type="button" onclick="insertLink('${textareaId}')" title="Insérer un lien">🔗 Lien</button>
                    
                    <span style="border-left: 1px solid #ccc; height: 20px; margin: 0 4px;"></span>
                    
                    <select onchange="changeFont('${textareaId}', this.value)">
                        <option value="">Police</option>
                        <option value="Arial">Arial</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Verdana">Verdana</option>
                    </select>
                    
                    <button type="button" onclick="insertSpoiler('${textareaId}')" style="background: #8e44ad; color: white; border: none; font-weight: bold;" title="Ajouter un spoiler">⚠️ Spoiler</button>
                </div>
            `;
        }

        // Injection de la barre d'outils au chargement
        document.getElementById('toolbar-topic-content').innerHTML = createEditorToolbar('topic-content');

        // --- FONCTIONS DE MANIPULATION DU TEXTE ---
        window.insertTag = function(id, startTag, endTag) {
            const ta = document.getElementById(id);
            const startPos = ta.selectionStart;
            const endPos = ta.selectionEnd;
            const selectedText = ta.value.substring(startPos, endPos);
            
            ta.value = ta.value.substring(0, startPos) + startTag + selectedText + endTag + ta.value.substring(endPos);
            ta.focus();
            ta.setSelectionRange(startPos + startTag.length, endPos + startTag.length);
        }

        window.insertLink = function(id) {
            const url = prompt("Entrez l'URL du lien :");
            if (url) {
                const ta = document.getElementById(id);
                const startPos = ta.selectionStart;
                const endPos = ta.selectionEnd;
                const selectedText = ta.value.substring(startPos, endPos) || "Texte du lien";
                const linkHtml = `<a href="${url}" target="_blank">${selectedText}</a>`;
                
                ta.value = ta.value.substring(0, startPos) + linkHtml + ta.value.substring(endPos);
                ta.focus();
            }
        }

        window.insertImage = function(id) {
            const url = prompt("Entrez l'URL de l'image :");
            if (url) {
                const ta = document.getElementById(id);
                const startPos = ta.selectionStart;
                const endPos = ta.selectionEnd;
                const imgHtml = `<img src="${url}" alt="Image" style="max-width: 100%; border-radius: 4px;">`;
                
                ta.value = ta.value.substring(0, startPos) + imgHtml + ta.value.substring(endPos);
                ta.focus();
            }
        }

        window.insertVideo = function(id) {
            const url = prompt("Entrez l'URL de la vidéo (ou lien embed) :");
            if (url) {
                const ta = document.getElementById(id);
                const startPos = ta.selectionStart;
                const endPos = ta.selectionEnd;
                const videoHtml = `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;"><iframe src="${url}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen></iframe></div>`;
                
                ta.value = ta.value.substring(0, startPos) + videoHtml + ta.value.substring(endPos);
                ta.focus();
            }
        }

        window.changeFont = function(id, fontName) {
            if (!fontName) return;
            const ta = document.getElementById(id);
            const startPos = ta.selectionStart;
            const endPos = ta.selectionEnd;
            const selectedText = ta.value.substring(startPos, endPos);
            const fontHtml = `<span style="font-family: '${fontName}', sans-serif;">${selectedText}</span>`;
            
            ta.value = ta.value.substring(0, startPos) + fontHtml + ta.value.substring(endPos);
            ta.focus();
        }

        window.insertSpoiler = function(id) {
            const ta = document.getElementById(id);
            const startPos = ta.selectionStart;
            const endPos = ta.selectionEnd;
            const selectedText = ta.value.substring(startPos, endPos);
            
            const spoilerMarkup = `<details style="background: #f9f4fb; border: 1px dashed #8e44ad; padding: 8px; border-radius: 4px; margin: 8px 0; cursor: pointer;"><summary style="font-weight: bold; color: #8e44ad; outline: none;">⚠️ Spoiler</summary><p style="margin: 6px 0 0 0; color: #333; font-size: 0.95em;">${selectedText || 'Votre texte de spoiler ici'}</p></details>`;
            
            ta.value = ta.value.substring(0, startPos) + spoilerMarkup + ta.value.substring(endPos);
            ta.focus();
        }

        // --- SOUMISSION DU FORMULAIRE ---
        document.getElementById('new-topic-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const category = document.getElementById('topic-type').value;
            const title = document.getElementById('topic-title-input').value;
            const content = document.getElementById('topic-content').value;
            const author = localStorage.getItem('forumUsername') || 'Admin_Otaku';

            const { data, error } = await supabase
                .from('topics')
                .insert([{ title, content, category, author }])
                .select();

            if (error) {
                alert("Erreur lors de la publication : " + error.message);
            } else {
                window.location.href = `topic.html?id=${data[0].id}`;
            }
        });
    </script>
</body>
</html>
