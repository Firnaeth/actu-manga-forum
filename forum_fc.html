<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Club - Actu Manga World</title>
    <style>
        body { background-color: #dce7f0; font-family: Verdana, sans-serif; font-size: 12px; margin: 0; padding: 20px; }
        #wrapper { width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        
        /* En-tête */
        .header-banner { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        
        /* Navigation */
        .nav { margin: 15px 0; padding: 10px; background: #f78fb3; border-radius: 4px; }
        .nav a { color: white; margin-right: 15px; text-decoration: none; font-weight: bold; }
        
        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #f78fb3; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        
        /* Admin */
        #admin-panel { background: #fff0f5; padding: 15px; border: 1px solid #ffb6c1; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="wrapper">
        <!-- Barre Admin -->
        <div id="admin-panel" class="hidden">
            <strong>⚙️ Espace Administration</strong><br>
            <input type="text" id="new-banner-url" placeholder="Nouvelle URL de bannière" style="width: 300px;">
            <button id="save-banner">Enregistrer</button>
        </div>

        <img id="main-banner" src="https://images.alphacoders.com/605/605592.png" class="header-banner">

        <div class="nav">
            <a href="index.html">Accueil</a>
            <a href="fan-clubs.html">Fan Clubs</a>
            <span id="user-area"></span>
        </div>

        <h1 id="fc-title">Chargement...</h1>
        <p id="fc-desc"></p>

        <table>
            <thead>
                <tr><th>Sujet</th><th>Auteur</th></tr>
            </thead>
            <tbody id="topics-list">
                <tr><td colspan="2">Chargement des sujets...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        // 1. Initialisation
        const fcId = new URLSearchParams(window.location.search).get('id');
        const role = localStorage.getItem('forumUserRole');

        // 2. Afficher interface admin si besoin
        if (role === 'admin' || role === 'modo') {
            document.getElementById('admin-panel').classList.remove('hidden');
        }

        // 3. Charger et afficher le Fan Club
        async function initPage() {
            if (!fcId) return;

            const { data, error } = await supabase.from('topics').select('*').eq('id', fcId).single();
            if (data) {
                document.getElementById('fc-title').textContent = data.title;
                document.getElementById('fc-desc').textContent = data.content;
            }
        }

        // 4. Gestion Bannière
        document.getElementById('save-banner').addEventListener('click', () => {
            const url = document.getElementById('new-banner-url').value;
            if(url) {
                localStorage.setItem('customBanner', url);
                document.getElementById('main-banner').src = url;
                alert('Bannière mise à jour !');
            }
        });

        // Appliquer bannière sauvegardée
        const savedBanner = localStorage.getItem('customBanner');
        if (savedBanner) document.getElementById('main-banner').src = savedBanner;

        initPage();
    </script>
</body>
</html>
