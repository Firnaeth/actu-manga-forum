<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujet - Forum Actu Manga</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .btn-mod { background: #e74c3c; color: white; border: none; padding: 3px 8px; font-size: 0.8em; border-radius: 3px; cursor: pointer; margin-left: 5px; }
        .btn-edit { background: #f39c12; color: white; border: none; padding: 3px 8px; font-size: 0.8em; border-radius: 3px; cursor: pointer; }
        .post-signature { margin-top: 20px; padding-top: 10px; border-top: 1px dashed #ffb6c1; }
        .post-signature img { max-width: 100%; height: auto; display: block; }
    </style>
</head>
<body>

    <div id="wrapper">
        <!-- BREADCRUMB DYNAMIQUE -->
        <div class="breadcrumb" id="topic-breadcrumb">
            <a href="index.html">Index du Forum</a> &raquo; 
            <span id="bread-category-slot"><a href="index.html">Chargement...</a></span> &raquo; 
            <span id="bread-topic-title">Chargement...</span>
        </div>

        <h1 class="topic-main-title" id="topic-title">Chargement du sujet...</h1>

        <div class="topic-actions" style="display: flex; gap: 10px; margin-bottom: 15px;">
            <a href="create-topic.html" id="btn-create-topic" class="btn-submit" style="text-decoration: none; font-weight: bold;">+ Créer un nouveau sujet</a>
            <a href="#reply-form" class="btn-reply">Répondre à ce sujet</a>
        </div>

        <!-- CONTENEUR GLOBAL DES POSTS (SUJET + RÉPONSES) -->
        <div id="posts-container">
            <p style="text-align: center; padding: 20px;">Chargement du sujet et des réponses...</p>
        </div>

        <div class="reply-box" id="reply-form">
            <div class="box-title">Poster une réponse</div>
            <form class="reply-form" id="form-add-reply">
                <textarea id="message" rows="6" placeholder="Écrivez votre réponse ici... (Collez un lien direct http... pour afficher une image)" required></textarea>
                <button type="submit" class="btn-submit" style="margin-top: 10px;">Envoyer</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        // --- 1. VÉRIFICATION DE LA VRAIE SESSION ---
        const currentUsername = localStorage.getItem('forumUsername');
        const currentRole = localStorage.getItem('forumUserRole') || 'member';
        const isStaff = (currentRole === 'admin' || currentRole === 'modo');

        // --- 2. CONFIGURATION DES CATÉGORIES ---
        const categoryMap = {
            'planning': { name: 'Planning des Sorties VF', url: 'news.html' },
            'manga': { name: 'Discussion Manga', url: 'community.html' },
            'gaming': { name: 'Zone Gaming', url: 'gaming.html' },
            'fc': { name: 'Fan Clubs Officiels', url: 'forum_fc.html' },
            'graphisme': { name: 'Atelier Graphique', url: 'atelier.html' },
            'general': { name: 'Général', url: 'general.html' }
        };

        // --- 3. FONCTION DE TRANSFORMATION DES LIENS EN IMAGES ---
        function formatContent(text) {
            if (!text) return '';
            const urlRegex = /(https?:\/\/[^\s]+\.(?:png|jpg|jpeg|gif))/gi;
            let formatted = text.replace(urlRegex, (url) => {
                return `<br><img src="${url}" alt="Image" style="max-width: 100%; border-radius: 4px; margin: 10px 0;"><br>`;
            });
            return formatted.replace(/\n/g, '<br>');
        }

        const topicId = new URLSearchParams(window.location.search).get('id');

        // --- 4. CHARGEMENT DU SUJET ET DES RÉPONSES ---
        async function loadTopicAndReplies() {
            if (!topicId) {
                document.getElementById('posts-container').innerHTML = "<p>Aucun sujet spécifié.</p>";
                return;
            }

            // A. Charger le sujet principal
            const { data: topic, error: topicError } = await supabase
                .from('topics')
                .select('*')
                .eq('id', topicId)
                .single();

            if (topicError || !topic) {
                document.getElementById('posts-container').innerHTML = "<p>Sujet introuvable.</p>";
                return;
            }

            document.getElementById('topic-title').textContent = topic.title;
            document.getElementById('bread-topic-title').textContent = topic.title;
            
            const catInfo = categoryMap[topic.category] || { name: topic.category, url: 'index.html' };
            document.getElementById('bread-category-slot').innerHTML = `<a href="${catInfo.url}">${catInfo.name}</a>`;

            // Récupérer la signature de l'auteur du sujet
            let authorSignatureHtml = '';
            if (topic.author) {
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('signature')
                    .eq('username', topic.author)
                    .single();

                if (profile && profile.signature) {
                    if (profile.signature.startsWith('http://') || profile.signature.startsWith('https://')) {
                        authorSignatureHtml = `<div class="post-signature"><img src="${profile.signature}" alt="Signature"></div>`;
                    } else {
                        authorSignatureHtml = `<div class="post-signature"><small>${profile.signature}</small></div>`;
                    }
                }
            }

            const isAuthorStaff = (topic.author || '').includes('Otaku') || (topic.author || '').includes('Modo');

            // Construction du HTML du premier message
            let htmlContent = `
                <div class="post-box">
                    <div class="post-user">
                        <a href="profile.html?user=${topic.author}" class="username ${isAuthorStaff ? 'admin' : 'member'}">${topic.author || 'Anonyme'}</a>
                        <div class="user-rank">${isAuthorStaff ? 'Staff' : 'Membre'}</div>
                    </div>
                    <div class="post-content">
                        <div class="post-date">Posté le ${new Date(topic.created_at).toLocaleDateString()}
                            ${isStaff ? `<button class="btn-edit" onclick="editTopic(${topic.id})">Éditer</button>
                                        <button class="btn-mod" onclick="deleteTopic(${topic.id})">Supprimer</button>` : ''}
                        </div>
                        <div class="post-text" style="margin-top: 10px;">
                            ${formatContent(topic.content)}
                        </div>
                        ${authorSignatureHtml}
                    </div>
                </div>
            `;

            // B. Charger les réponses (replies) associées à ce sujet
            const { data: replies, error: repliesError } = await supabase
                .from('replies')
                .select('*')
                .eq('topic_id', topicId)
                .order('created_at', { ascending: true });

            if (!repliesError && replies && replies.length > 0) {
                for (const reply of replies) {
                    const isReplyStaff = (reply.author || '').includes('Otaku') || (reply.author || '').includes('Modo');
                    
                    // Optionnel : récupérer la signature de l'auteur de la réponse
                    let replySigHtml = '';
                    const { data: replyProfile } = await supabase
                        .from('profiles')
                        .select('signature')
                        .eq('username', reply.author)
                        .single();

                    if (replyProfile && replyProfile.signature) {
                        if (replyProfile.signature.startsWith('http://') || replyProfile.signature.startsWith('https://')) {
                            replySigHtml = `<div class="post-signature"><img src="${replyProfile.signature}" alt="Signature"></div>`;
                        } else {
                            replySigHtml = `<div class="post-signature"><small>${replyProfile.signature}</small></div>`;
                        }
                    }

                    htmlContent += `
                        <div class="post-box" style="margin-top: 15px;">
                            <div class="post-user">
                                <a href="profile.html?user=${reply.author}" class="username ${isReplyStaff ? 'admin' : 'member'}">${reply.author || 'Anonyme'}</a>
                                <div class="user-rank">${isReplyStaff ? 'Staff' : 'Membre'}</div>
                            </div>
                            <div class="post-content">
                                <div class="post-date">Répondu le ${new Date(reply.created_at).toLocaleDateString()}
                                    ${isStaff ? `<button class="btn-mod" onclick="deleteReply(${reply.id})">Supprimer</button>` : ''}
                                </div>
                                <div class="post-text" style="margin-top: 10px;">
                                    ${formatContent(reply.content)}
                                </div>
                                ${replySigHtml}
                            </div>
                        </div>
                    `;
                }
            }

            document.getElementById('posts-container').innerHTML = htmlContent;
        }

        // --- 5. ENVOI D'UNE NOUVELLE RÉPONSE ---
        document.getElementById('form-add-reply').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!currentUsername) {
                alert("Vous devez être connecté pour répondre.");
                return;
            }

            const content = document.getElementById('message').value;

            const { error } = await supabase
                .from('replies')
                .insert([{
                    topic_id: topicId,
                    author: currentUsername,
                    content: content
                }]);

            if (error) {
                alert("Erreur lors de l'envoi de la réponse : " + error.message);
            } else {
                document.getElementById('message').value = '';
                loadTopicAndReplies(); // Recharger la liste pour afficher la nouvelle réponse instantanément
            }
        });

        // --- 6. ACTIONS DE MODÉRATION ---
        window.deleteTopic = async (id) => {
            if(confirm("Supprimer ce sujet ?")) {
                await supabase.from('topics').delete().eq('id', id);
                window.location.href = "index.html";
            }
        };

        window.editTopic = async (id) => {
            const newContent = prompt("Nouveau contenu :");
            if (newContent) {
                await supabase.from('topics').update({ content: newContent }).eq('id', id);
                location.reload();
            }
        };

        window.deleteReply = async (id) => {
            if(confirm("Supprimer cette réponse ?")) {
                await supabase.from('replies').delete().eq('id', id);
                loadTopicAndReplies();
            }
        };

        loadTopicAndReplies();
    </script>
</body>
</html>
