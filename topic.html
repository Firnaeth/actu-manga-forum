<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture de Topic - Actu Manga World</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="wrapper">

        <!-- EN-TÊTE ET NAVIGATION -->
        <div class="main-header">
            <img id="forum-banner-img" src="https://images.alphacoders.com/605/605592.png" alt="Bannière Forum Manga" class="header-banner">
        </div>

        <nav class="forum-nav">
            <a href="index.html" class="nav-link">Index</a>
            <a href="community.html" class="nav-link">Fiches & Critiques</a>
            <a href="contest-view.html" class="nav-link">Concours Dessin</a>
            <a href="mangatheques.html" class="nav-link">Mangathèques</a>
            <a href="profile.html" id="nav-profile-link" class="nav-link hidden">Mon Profil</a>
            <a href="register.html" id="nav-auth-link" class="nav-link">S'enregistrer</a>
        </nav>

        <!-- CONTENU DU TOPIC -->
        <div style="margin-top: 15px; margin-bottom: 10px;">
            <a href="community.html" style="color: #2e51a2; text-decoration: underline; font-size: 0.9em;">&laquo; Retour à la liste des sujets</a>
            <h2 id="topic-title" style="margin-top: 5px; color: #333; border-bottom: 2px solid #ccc; padding-bottom: 5px;">Chargement du topic...</h2>
        </div>

        <!-- LISTE DES MESSAGES -->
        <div id="posts-container">
            <div style="text-align: center; padding: 20px;"><em>Chargement des messages...</em></div>
        </div>

        <!-- FORMULAIRE DE RÉPONSE RAPIDE (Visible si connecté) -->
        <div id="reply-section" class="hidden" style="margin-top: 20px; background: #f9f9f9; padding: 15px; border: 1px solid #ccc; border-radius: 4px;">
            <h3>Répondre à ce sujet</h3>
            <form id="reply-form">
                <textarea id="reply-content" rows="4" placeholder="Votre message..." style="width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc;" required></textarea>
                <button type="submit" style="background: #2e51a2; color: white; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold;">Envoyer la réponse</button>
            </form>
        </div>

    </div>

    <!-- SCRIPT DE CHARGEMENT SUPABASE -->
    <script type="module">
        import { supabase } from './supabase.js';

        // Gestion de l'affichage connexion / déconnexion dans la nav
        const currentUsername = localStorage.getItem('forumUsername');
        const profileLink = document.getElementById('nav-profile-link');
        const authLink = document.getElementById('nav-auth-link');
        const replySection = document.getElementById('reply-section');
        
        if (currentUsername) {
            profileLink.classList.remove('hidden');
            replySection.classList.remove('hidden');
            authLink.textContent = "Déconnexion";
            authLink.setAttribute('href', '#');
            authLink.onclick = async (e) => {
                e.preventDefault();
                try { await supabase.auth.signOut(); } catch (err) {}
                localStorage.clear();
                window.location.href = 'index.html';
            };
        }

        // Récupérer l'ID du topic depuis l'URL (ex: topic.html?id=1)
        const urlParams = new URLSearchParams(window.location.search);
        const topicId = urlParams.get('id');

        async function loadTopicData() {
            const postsContainer = document.getElementById('posts-container');
            const topicTitleEl = document.getElementById('topic-title');
            const defaultAvatar = "https://i.pinimg.com/236x/d9/1b/2e/d91b2e2b34a6210f22ef2f8bb7df5f06.jpg";

            if (!topicId) {
                topicTitleEl.textContent = "Topic introuvable";
                postsContainer.innerHTML = `<p style="text-align: center; color: red;">Aucun identifiant de topic spécifié.</p>`;
                return;
            }

            // 1. Récupérer les informations du sujet principal (optionnel selon ta structure de tables)
            // Ici on suppose une table 'topics' ou on charge directement les messages liés à un topic_id
            // 2. Charger les messages avec une jointure sur la table 'profiles' pour choper l'avatar et les infos
            const { data: posts, error } = await supabase
                .from('posts') // Remplace par le nom exact de ta table de messages si besoin
                .select(`
                    id,
                    content,
                    created_at,
                    username,
                    profiles (
                        avatar_url,
                        rank,
                        age,
                        gender,
                        mood,
                        favorite_manga
                    )
                `)
                .eq('topic_id', topicId)
                .order('created_at', { ascending: true });

            if (error) {
                postsContainer.innerHTML = `<p style="text-align: center; color: red;">Erreur lors du chargement des messages.</p>`;
                return;
            }

            if (!posts || posts.length === 0) {
                topicTitleEl.textContent = "Discussion";
                postsContainer.innerHTML = `<p style="text-align: center; padding: 20px;">Aucun message dans ce topic pour le moment.</p>`;
                return;
            }

            topicTitleEl.textContent = "Fil de discussion # " + topicId;

            // Affichage de chaque message avec la carte profil du membre sur le côté
            postsContainer.innerHTML = posts.map(post => {
                // Récupération sécurisée des données du profil lié
                const profile = post.profiles || {};
                const avatar = (profile.avatar_url && profile.avatar_url.trim() !== "") ? profile.avatar_url : defaultAvatar;
                const rank = profile.rank ? profile.rank : '<span style="color: #7f8c8d;">Membre</span>';
                
                // Infos complémentaires (âge, sexe, humeur, favori)
                const age = profile.age ? `${profile.age} ans` : '';
                const gender = profile.gender ? `${profile.gender}` : '';
                const mood = profile.mood ? `Humeur : ${profile.mood}` : '';
                const fav = profile.favorite_manga ? `Fav : ${profile.favorite_manga}` : '';
                
                const details = [age, gender, mood, fav].filter(Boolean).join(' • ');

                return `
                    <div style="display: flex; border: 1px solid #ccc; margin-bottom: 10px; background: #fff; border-radius: 4px; overflow: hidden;">
                        <!-- Colonne Profil / Membre -->
                        <div style="width: 180px; background: #f4f4f4; padding: 10px; text-align: center; border-right: 1px solid #ccc; font-size: 0.85em;">
                            <a href="profile.html?user=${encodeURIComponent(post.username)}" style="font-weight: bold; color: #2e51a2; text-decoration: underline;">${post.username}</a>
                            <div style="margin: 8px 0;">
                                <img src="${avatar}" alt="${post.username}" style="width: 70px; height: 70px; border-radius: 4px; object-fit: cover; border: 1px solid #bbb;">
                            </div>
                            <div style="font-weight: bold; color: #c0392b; margin-bottom: 4px;">${rank}</div>
                            <div style="color: #555; font-size: 0.8em; line-height: 1.2;">${details || '<em>Pas d\'infos</em>'}</div>
                        </div>

                        <!-- Colonne Message -->
                        <div style="flex: 1; padding: 12px; display: flex; flex-direction: column; justify-content: space-between;">
                            <div style="font-size: 0.8em; color: #888; border-bottom: 1px solid #eee; padding-bottom: 4px; margin-bottom: 8px;">
                                Posté le ${new Date(post.created_at).toLocaleString('fr-FR')}
                            </div>
                            <div style="font-size: 0.95em; color: #222; line-height: 1.4; white-space: pre-wrap;">${post.content}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Gestion de l'envoi d'une réponse
        const replyForm = document.getElementById('reply-form');
        if (replyForm) {
            replyForm.onsubmit = async (e) => {
                e.preventDefault();
                const content = document.getElementById('reply-content').value;
                const username = localStorage.getItem('forumUsername');

                if (!username) {
                    alert("Vous devez être connecté pour répondre.");
                    return;
                }

                const { error } = await supabase
                    .from('posts')
                    .insert([{ topic_id: topicId, username: username, content: content }]);

                if (error) {
                    alert("Erreur lors de l'envoi du message : " + error.message);
                } else {
                    document.getElementById('reply-content').value = "";
                    loadTopicData(); // Recharger les messages
                }
            };
        }

        loadTopicData();
    </script>
</body>
</html>
