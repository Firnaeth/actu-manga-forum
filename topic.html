<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujet - Forum Actu Manga</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .btn-mod { background: #e74c3c; color: white; border: none; padding: 3px 8px; font-size: 0.8em; border-radius: 3px; cursor: pointer; margin-left: 5px; }
        .btn-edit { background: #f39c12; color: white; border: none; padding: 3px 8px; font-size: 0.8em; border-radius: 3px; cursor: pointer; }
        .post-signature { margin-top: 20px; padding-top: 10px; border-top: 1px dashed #ffb6c1; }
        .post-signature img { max-width: 100%; height: auto; display: block; }
        
        /* Styles pour le mini-profil dans les messages */
        .post-user {
            text-align: center;
            padding: 10px;
        }
        .post-user-avatar img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ddd;
            margin-bottom: 5px;
        }
        .post-user-details {
            font-size: 0.85em;
            color: #555;
            margin-top: 8px;
            text-align: left;
            border-top: 1px dashed #eee;
            padding-top: 6px;
        }
        .post-user-details p {
            margin: 3px 0;
        }

        /* Style de la barre d'outils unifiée */
        .editor-toolbar {
            background: #f1f1f1;
            padding: 6px;
            border: 1px solid #ccc;
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
            border-radius: 4px 4px 0 0;
            margin-top: 10px;
        }
        .editor-toolbar button, .editor-toolbar select {
            padding: 4px 8px;
            cursor: pointer;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 0.9em;
        }
        .editor-toolbar button:hover, .editor-toolbar select:hover {
            background: #e2e2e2;
        }
        .editor-textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 4px 4px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="wrapper">
        <div class="breadcrumb" id="topic-breadcrumb">
            <a href="index.html">Index du Forum</a> &raquo; 
            <span id="bread-category-slot"><a href="index.html">Chargement...</a></span> &raquo; 
            <span id="bread-topic-title">Chargement...</span>
        </div>

        <h1 class="topic-main-title" id="topic-title">Chargement du sujet...</h1>

        <div class="topic-actions" style="display: flex; gap: 10px; margin-bottom: 15px;">
            <a href="create-topic.html" id="btn-create-topic" class="btn-submit" style="text-decoration: none; font-weight: bold;">+ Créer un nouveau sujet</a>
            <a href="#reply-form" class="btn-reply" id="btn-goto-reply">Répondre à ce sujet</a>
        </div>

        <div id="posts-container">
            <p style="text-align: center; padding: 20px;">Chargement du sujet et des réponses...</p>
        </div>

        <div class="reply-box" id="reply-form-container">
            <div class="box-title">Poster une réponse</div>
            
            <div id="toolbar-reply"></div>

            <form class="reply-form" id="form-add-reply">
                <textarea id="message" rows="12" class="editor-textarea" placeholder="Écrivez votre réponse ici..." required></textarea>
                <button type="submit" class="btn-submit" style="margin-top: 10px;">Envoyer</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        // --- FONCTION QUI GÉNÈRE LA BARRE D'OUTILS POUR N'IMPORTE QUEL TEXTAREA ---
        window.createEditorToolbar = function(textareaId) {
            const containerId = 'toolbar-' + textareaId;
            return `
                <div class="editor-toolbar">
                    <button type="button" onclick="insertTag('${textareaId}', '**', '**')" style="font-weight: bold;" title="Gras">B</button>
                    <button type="button" onclick="insertTag('${textareaId}', '*', '*')" style="font-style: italic;" title="Italique">I</button>
                    <button type="button" onclick="insertTag('${textareaId}', '<u>', '</u>')" style="text-decoration: underline;" title="Souligné">U</button>
                    <button type="button" onclick="insertTag('${textareaId}', '<p>', '</p>')" title="Paragraphe">Paragraphe</button>
                    
                    <span style="border-left: 1px solid #ccc; height: 20px; margin: 0 4px;"></span>
                    
                    <button type="button" onclick="insertImage('${textareaId}')" title="Insérer une image">🖼️ Image</button>
                    <button type="button" onclick="insertVideo('${textareaId}')" title="Insérer une vidéo">🎬 Vidéo</button>
                    <button type="button" onclick="insertLink('${textareaId}')" title="Insérer un lien">🔗 Lien</button>
                    
                    <span style="border-left: 1px solid #ccc; height: 20px; margin: 0 4px;"></span>
                    
                    <select onchange="changeFont('${textareaId}', this.value)">
                        <option value="">Police</option>
                        <option value="Arial">Arial</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Verdana">Verdana</option>
                    </select>
                    
                    <button type="button" onclick="insertSpoiler('${textareaId}')" style="background: #8e44ad; color: white; border: none; font-weight: bold;" title="Ajouter un spoiler">⚠️ Spoiler</button>
                </div>
            `;
        }

        // Injecte la barre d'outils dans le formulaire de réponse principal
        document.getElementById('toolbar-reply').innerHTML = createEditorToolbar('message');

        // --- FONCTIONS DE MANIPULATION DU TEXTE ---
        window.insertTag = function(id, startTag, endTag) {
            const ta = document.getElementById(id);
            const startPos = ta.selectionStart;
            const endPos = ta.selectionEnd;
            const selectedText = ta.value.substring(startPos, endPos);
            
            ta.value = ta.value.substring(0, startPos) + startTag + selectedText + endTag + ta.value.substring(endPos);
            ta.focus();
            ta.setSelectionRange(startPos + startTag.length, endPos + startTag.length);
        }

        window.insertLink = function(id) {
            const url = prompt("Entrez l'URL du lien :");
            if (url) {
                const ta = document.getElementById(id);
                const startPos = ta.selectionStart;
                const endPos = ta.selectionEnd;
                const selectedText = ta.value.substring(startPos, endPos) || "Texte du lien";
                const linkHtml = `<a href="${url}" target="_blank">${selectedText}</a>`;
                
                ta.value = ta.value.substring(0, startPos) + linkHtml + ta.value.substring(endPos);
                ta.focus();
            }
        }

        window.insertImage = function(id) {
            const url = prompt("Entrez l'URL de l'image :");
            if (url) {
                const ta = document.getElementById(id);
                const startPos = ta.selectionStart;
                const endPos = ta.selectionEnd;
                const imgHtml = `<img src="${url}" alt="Image" style="max-width: 100%; border-radius: 4px;">`;
                
                ta.value = ta.value.substring(0, startPos) + imgHtml + ta.value.substring(endPos);
                ta.focus();
            }
        }

        window.insertVideo = function(id) {
            const url = prompt("Entrez l'URL de la vidéo (ou lien embed) :");
            if (url) {
                const ta = document.getElementById(id);
                const startPos = ta.selectionStart;
                const endPos = ta.selectionEnd;
                const videoHtml = `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;"><iframe src="${url}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen></iframe></div>`;
                
                ta.value = ta.value.substring(0, startPos) + videoHtml + ta.value.substring(endPos);
                ta.focus();
            }
        }

        window.changeFont = function(id, fontName) {
            if (!fontName) return;
            const ta = document.getElementById(id);
            const startPos = ta.selectionStart;
            const endPos = ta.selectionEnd;
            const selectedText = ta.value.substring(startPos, endPos);
            const fontHtml = `<span style="font-family: '${fontName}', sans-serif;">${selectedText}</span>`;
            
            ta.value = ta.value.substring(0, startPos) + fontHtml + ta.value.substring(endPos);
            ta.focus();
        }

        window.insertSpoiler = function(id) {
            const ta = document.getElementById(id);
            const startPos = ta.selectionStart;
            const endPos = ta.selectionEnd;
            const selectedText = ta.value.substring(startPos, endPos);
            
            const spoilerMarkup = `<details style="background: #f9f4fb; border: 1px dashed #8e44ad; padding: 8px; border-radius: 4px; margin: 8px 0; cursor: pointer;"><summary style="font-weight: bold; color: #8e44ad; outline: none;">⚠️ Spoiler</summary><p style="margin: 6px 0 0 0; color: #333; font-size: 0.95em;">${selectedText || 'Votre texte de spoiler ici'}</p></details>`;
            
            ta.value = ta.value.substring(0, startPos) + spoilerMarkup + ta.value.substring(endPos);
            ta.focus();
        }

        // --- 1. VÉRIFICATION DE LA SESSION ---
        const currentUsername = localStorage.getItem('forumUsername');
        const currentRole = (localStorage.getItem('forumUserRole') || 'member').toLowerCase();
        const isStaff = (currentRole === 'admin' || currentRole === 'mod' || currentRole === 'modo' || currentRole === 'moderator' || currentRole === 'modérateur');

        const replyFormContainer = document.getElementById('reply-form-container');
        const btnGotoReply = document.getElementById('btn-goto-reply');
        const btnCreateTopic = document.getElementById('btn-create-topic');

        if (!currentUsername) {
            if (btnCreateTopic) btnCreateTopic.style.display = 'none';
            if (btnGotoReply) btnGotoReply.style.display = 'none';
            if (replyFormContainer) {
                replyFormContainer.innerHTML = `
                    <div class="box-title">Poster une réponse</div>
                    <div style="background: #fff3cd; color: #856404; padding: 15px; border-radius: 4px; border: 1px solid #ffeeba; font-size: 0.95em; text-align: center; margin-top: 10px;">
                        🔒 Vous devez être <strong>connecté</strong> pour créer un sujet ou poster une réponse. <a href="register.html" style="color: #c2185b; font-weight: bold;">Se connecter / S'enregistrer</a>
                    </div>
                `;
            }
        }

        const categoryMap = {
            'planning': { name: 'Planning des Sorties VF', url: 'news.html' },
            'manga': { name: 'Discussion Manga', url: 'community.html' },
            'gaming': { name: 'Zone Gaming', url: 'gaming.html' },
            'fc': { name: 'Fan Clubs Officiels', url: 'forum_fc.html' },
            'graphisme': { name: 'Atelier Graphique', url: 'atelier.html' },
            'general': { name: 'Général', url: 'general.html' }
        };

        function formatContent(text) {
            if (!text) return '';
            const urlRegex = /(https?:\/\/[^\s]+\.(?:png|jpg|jpeg|gif))/gi;
            let formatted = text.replace(urlRegex, (url) => {
                if (text.includes(`src="${url}"`)) return url;
                return `<br><img src="${url}" alt="Image" style="max-width: 100%; border-radius: 4px; margin: 10px 0;"><br>`;
            });
            return formatted.replace(/\n/g, '<br>');
        }

        const topicId = new URLSearchParams(window.location.search).get('id');

        async function buildUserProfileBox(username) {
            if (!username) {
                return `
                    <div class="post-user">
                        <div class="post-user-avatar"><img src="https://i.pinimg.com/236x/d9/1b/2e/d91b2e2b34a6210f22ef2f8bb7df5f06.jpg" alt="Avatar"></div>
                        <span class="username member">Anonyme</span>
                        <div class="user-rank rank-member">Membre</div>
                    </div>
                `;
            }

            const { data: profile } = await supabase
                .from('profiles')
                .select('*')
                .eq('username', username)
                .single();

            const avatarUrl = (profile && profile.avatar_url) ? profile.avatar_url : 'https://i.pinimg.com/236x/d9/1b/2e/d91b2e2b34a6210f22ef2f8bb7df5f06.jpg';
            const userRole = profile && profile.role ? profile.role.toLowerCase() : 'member';
            const userRankText = profile && profile.rank ? profile.rank : (userRole === 'admin' ? 'Administrateur' : (userRole === 'mod' || userRole === 'moderator' || userRole === 'modérateur' || userRole === 'modo') ? 'Modérateur' : 'Membre');
            
            let rankClass = 'rank-member';
            if (userRole === 'admin') rankClass = 'rank-admin';
            else if (userRole === 'mod' || userRole === 'moderator' || userRole === 'modérateur' || userRole === 'modo') rankClass = 'rank-mod';

            const ageText = (profile && profile.age) ? `${profile.age} ans` : '-';
            const sexRaceText = (profile && profile.sex_race) ? profile.sex_race : '-';
            let statutText = (profile && profile.status && profile.status !== 'EMPTY') ? profile.status : '-';

            const { count: topicsCount } = await supabase.from('topics').select('*', { count: 'exact', head: true }).eq('author', username);
            const { count: repliesCount } = await supabase.from('replies').select('*', { count: 'exact', head: true }).eq('author', username);
            const totalPosts = (topicsCount || 0) + (repliesCount || 0);

            return `
                <div class="post-user">
                    <div class="post-user-avatar"><img src="${avatarUrl}" alt="Avatar"></div>
                    <div><a href="profile.html?user=${username}" class="username ${userRole === 'admin' ? 'admin' : 'member'}" style="font-weight: bold;">${username}</a></div>
                    <div><span class="rank ${rankClass}">${userRankText}</span></div>
                    <div class="post-user-details">
                        <p><strong>Âge :</strong> ${ageText}</p>
                        <p><strong>Sexe/Race :</strong> ${sexRaceText}</p>
                        <p><strong>Statut :</strong> ${statutText}</p>
                        <p><strong>Messages :</strong> ${totalPosts}</p>
                    </div>
                </div>
            `;
        }

        async function loadTopicAndReplies() {
            if (!topicId) {
                document.getElementById('posts-container').innerHTML = "<p>Aucun sujet spécifié.</p>";
                return;
            }

            const { data: topic, error: topicError } = await supabase.from('topics').select('*').eq('id', topicId).single();
            if (topicError || !topic) {
                document.getElementById('posts-container').innerHTML = "<p>Sujet introuvable.</p>";
                return;
            }

            document.getElementById('topic-title').textContent = topic.title;
            document.getElementById('bread-topic-title').textContent = topic.title;
            const catInfo = categoryMap[topic.category] || { name: topic.category, url: 'index.html' };
            document.getElementById('bread-category-slot').innerHTML = `<a href="${catInfo.url}">${catInfo.name}</a>`;

            let authorSignatureHtml = '';
            if (topic.author) {
                const { data: profile } = await supabase.from('profiles').select('signature').eq('username', topic.author).single();
                if (profile && profile.signature) {
                    if (profile.signature.startsWith('http://') || profile.signature.startsWith('https://')) {
                        authorSignatureHtml = `<div class="post-signature"><img src="${profile.signature}" alt="Signature"></div>`;
                    } else {
                        authorSignatureHtml = `<div class="post-signature"><small>${profile.signature}</small></div>`;
                    }
                }
            }

            const authorBoxHtml = await buildUserProfileBox(topic.author);
            const canManageTopic = (currentUsername === topic.author || isStaff);

            let htmlContent = `
                <div class="post-box">
                    ${authorBoxHtml}
                    <div class="post-content">
                        <div class="post-date">Posté le ${new Date(topic.created_at).toLocaleDateString()}
                            ${canManageTopic ? `<button class="btn-edit" onclick="editTopic(${topic.id})">Éditer</button><button class="btn-mod" onclick="deleteTopic(${topic.id})">Supprimer</button>` : ''}
                        </div>
                        <div class="post-text" style="margin-top: 10px;">${formatContent(topic.content)}</div>
                        ${authorSignatureHtml}
                    </div>
                </div>
            `;

            const { data: replies } = await supabase.from('replies').select('*').eq('topic_id', topicId).order('created_at', { ascending: true });
            if (replies && replies.length > 0) {
                for (const reply of replies) {
                    let replySigHtml = '';
                    const { data: replyProfile } = await supabase.from('profiles').select('signature').eq('username', reply.author).single();
                    if (replyProfile && replyProfile.signature) {
                        if (replyProfile.signature.startsWith('http://') || replyProfile.signature.startsWith('https://')) {
                            replySigHtml = `<div class="post-signature"><img src="${replyProfile.signature}" alt="Signature"></div>`;
                        } else {
                            replySigHtml = `<div class="post-signature"><small>${replyProfile.signature}</small></div>`;
                        }
                    }

                    const replyAuthorBoxHtml = await buildUserProfileBox(reply.author);
                    const canManageReply = (currentUsername === reply.author || isStaff);

                    htmlContent += `
                        <div class="post-box" style="margin-top: 15px;">
                            ${replyAuthorBoxHtml}
                            <div class="post-content">
                                <div class="post-date">Répondu le ${new Date(reply.created_at).toLocaleDateString()}
                                    ${canManageReply ? `<button class="btn-edit" onclick="editReply(${reply.id})">Éditer</button><button class="btn-mod" onclick="deleteReply(${reply.id})">Supprimer</button>` : ''}
                                </div>
                                <div class="post-text" style="margin-top: 10px;">${formatContent(reply.content)}</div>
                                ${replySigHtml}
                            </div>
                        </div>
                    `;
                }
            }

            document.getElementById('posts-container').innerHTML = htmlContent;
        }

        const formAddReply = document.getElementById('form-add-reply');
        if (formAddReply) {
            formAddReply.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!currentUsername) {
                    alert("Vous devez être connecté pour répondre.");
                    return;
                }
                const content = document.getElementById('message').value;
                const { error } = await supabase.from('replies').insert([{ topic_id: topicId, author: currentUsername, content: content }]);
                if (error) {
                    alert("Erreur lors de l'envoi de la réponse : " + error.message);
                } else {
                    document.getElementById('message').value = '';
                    loadTopicAndReplies();
                }
            });
        }

        // --- MODIFICATION AMÉLIORÉE (AVEC PROMPT INTELLIGENT / ZONE DE MODIF) ---
        window.editTopic = async (id) => {
            const { data: topic } = await supabase.from('topics').select('content').eq('id', id).single();
            if(!topic) return;

            const newContent = prompt("Modifier le contenu du sujet :", topic.content);
            if (newContent !== null) {
                await supabase.from('topics').update({ content: newContent }).eq('id', id);
                location.reload();
            }
        };

        window.editReply = async (id) => {
            const { data: reply } = await supabase.from('replies').select('content').eq('id', id).single();
            if(!reply) return;

            const newContent = prompt("Modifier la réponse :", reply.content);
            if (newContent !== null) {
                await supabase.from('replies').update({ content: newContent }).eq('id', id);
                loadTopicAndReplies();
            }
        };

        window.deleteTopic = async (id) => {
            if(confirm("Supprimer ce sujet ?")) {
                await supabase.from('topics').delete().eq('id', id);
                window.location.href = "index.html";
            }
        };

        window.deleteReply = async (id) => {
            if(confirm("Supprimer cette réponse ?")) {
                await supabase.from('replies').delete().eq('id', id);
                loadTopicAndReplies();
            }
        };

        loadTopicAndReplies();
    </script>
</body>
</html>
