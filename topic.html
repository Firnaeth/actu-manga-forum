<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujet - Forum Actu Manga</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-bar { background: #2c3e50; color: #fff; padding: 8px 12px; margin-bottom: 15px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9em; }
        .btn-mod { background: #e74c3c; color: white; border: none; padding: 3px 8px; font-size: 0.8em; border-radius: 3px; cursor: pointer; margin-left: 5px; }
        .btn-edit { background: #f39c12; color: white; border: none; padding: 3px 8px; font-size: 0.8em; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="wrapper">
        <!-- BARRE DE CONNEXION / RÔLE -->
        <div class="admin-bar">
            <span>Connecté en tant que : <strong id="current-user-display">---</strong></span>
            <div>
                <a href="index.html" style="color: white; text-decoration: underline;">Retour à l'accueil</a>
            </div>
        </div>

        <!-- BREADCRUMB -->
        <div class="breadcrumb">
            <a href="index.html">Index du Forum</a> &raquo; <span id="bread-topic-title">Chargement...</span>
        </div>

        <h1 class="topic-main-title" id="topic-title">Chargement du sujet...</h1>

        <!-- ZONE D'AFFICHAGE DES POSTS -->
        <div id="posts-container">
            <p style="text-align: center; padding: 20px;">Chargement du message...</p>
        </div>

        <!-- FORMULAIRE POUR RÉPONDRE -->
        <div class="reply-box" id="reply-form" style="margin-top: 20px;">
            <div class="box-title">Poster une réponse</div>
            <form class="reply-form" id="form-add-reply">
                <label for="message">Votre message :</label>
                <textarea id="message" rows="6" placeholder="Écrivez votre réponse ici..." required></textarea>
                <button type="submit" class="btn-submit" style="margin-top: 10px;">Envoyer le message</button>
            </form>
        </div>
    </div>

    <!-- SCRIPT SUPABASE ET CHARGEMENT DU SUJET -->
    <script type="module">
        import { supabase } from './supabase.js';

        const currentUsername = localStorage.getItem('forumUsername') || 'Anonyme';
        document.getElementById('current-user-display').textContent = currentUsername;

        // Récupérer l'ID du sujet dans l'URL (ex: topic.html?id=123)
        const urlParams = new URLSearchParams(window.location.search);
        const topicId = urlParams.get('id');

        async function loadTopic() {
            if (!topicId) {
                alert("Aucun sujet spécifié !");
                window.location.href = "index.html";
                return;
            }

            // Récupérer le sujet depuis Supabase
            const { data: topic, error } = await supabase
                .from('topics')
                .select('*')
                .eq('id', topicId)
                .single();

            if (error || !topic) {
                console.error(error);
                document.getElementById('topic-title').textContent = "Sujet introuvable";
                document.getElementById('posts-container').innerHTML = `<p style="text-align:center; color:red;">Ce sujet n'existe plus ou a été supprimé.</p>`;
                return;
            }

            // Afficher le titre
            document.getElementById('topic-title').textContent = topic.title;
            document.getElementById('bread-topic-title').textContent = topic.title;

            // Afficher le message principal
            const postsContainer = document.getElementById('posts-container');
            postsContainer.innerHTML = `
                <div class="post-box">
                    <div class="post-user">
                        <a href="#" class="username">${topic.author || 'Anonyme'}</a>
                        <div class="user-rank">Membre</div>
                        <img src="https://i.pinimg.com/236x/88/33/1b/88331b1516e0535e6a2d1d36d338f08a.jpg" alt="Avatar" class="user-avatar">
                    </div>
                    <div class="post-content">
                        <div class="post-date">
                            <span>Posté le ${new Date(topic.created_at).toLocaleDateString()}</span>
                        </div>
                        <div class="post-text">
                            <p>${topic.content || 'Aucun contenu.'}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // Gestion de l'envoi d'une réponse (incrémente le compteur ou prévient l'utilisateur)
        document.getElementById('form-add-reply').addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = document.getElementById('message').value;

            if (!localStorage.getItem('forumUsername')) {
                alert("Vous devez être connecté pour répondre !");
                window.location.href = "register.html";
                return;
            }

            // Simple simulation d'ajout de réponse (tu pourras l'enregistrer dans une table replies si tu en as une)
            alert("Réponse envoyée avec succès ! (Fonctionnalité de stockage des réponses en cours)");
            document.getElementById('message').value = '';
        });

        loadTopic();
    </script>
</body>
</html>
